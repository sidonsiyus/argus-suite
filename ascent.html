<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCENT · Aviation Careers Board</title>
<style>
/* ══════════════════════════════════════════════════════════════
   ASCENT · Aviation Careers Board  —  part of the ARGUS SUITE
   Single file. No dependencies. Canvas 2D only. Offline capable.
   ══════════════════════════════════════════════════════════════ */
:root{
  --acc:#ff9e64; --acc2:#ffc48c;
  --ok:#3ee08f; --warn:#f0b64a; --bad:#ff5a63; --info:#5b8def;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --r:12px;
}
:root[data-theme="dark"]{
  --bg:#08060d; --bg2:#0d0a14; --card:#120f1b; --card2:#171322;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --txt:#ece8f4; --dim:#a49bb8; --faint:#6d6580;
  --glow:rgba(255,158,100,.14); --shadow:0 18px 50px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#f6f4f1; --bg2:#efece7; --card:#ffffff; --card2:#faf8f5;
  --line:rgba(20,14,30,.11); --line2:rgba(20,14,30,.2);
  --txt:#1a1622; --dim:#544c63; --faint:#857d95;
  --acc:#c2410c; --acc2:#9a3412;
  --glow:rgba(194,65,12,.09); --shadow:0 12px 34px rgba(40,30,60,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans); max-width:100vw;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#bgfx{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none}
:root[data-theme="light"] #bgfx{opacity:.3}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:0 22px 90px}

/* ═══ boot ═══ */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#boot .bm{font-family:var(--mono);font-size:26px;letter-spacing:14px;color:var(--acc);font-weight:700}
#boot .bs{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--faint);text-transform:uppercase}
#boot .bbar{width:240px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
#boot .bfill{height:100%;width:0;background:var(--acc);transition:width .35s}

/* ═══ header ═══ */
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:0 22px;overflow:hidden}
.hrow{display:flex;align-items:center;gap:16px;height:60px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:9px;text-decoration:none;flex:0 0 auto}
.brand b{font-family:var(--mono);font-size:17px;letter-spacing:6px;color:var(--txt);font-weight:700}
.brand span{font-family:var(--mono);font-size:9px;letter-spacing:2.4px;color:var(--acc);text-transform:uppercase}
.gsearch{flex:1;position:relative;max-width:520px}
.gsearch input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:999px;padding:9px 15px 9px 38px;font-family:var(--sans);font-size:13px;outline:none;transition:.15s}
.gsearch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.gsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--faint);fill:none;stroke-width:2}
.gsearch kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:9px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 5px}
.hbtns{display:flex;gap:8px;align-items:center;margin-left:auto}
.iconb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.15s}
.iconb:hover{border-color:var(--acc);color:var(--acc)}
.iconb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.backl{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--faint);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;transition:.15s;white-space:nowrap}
.backl:hover{color:var(--acc);border-color:var(--acc)}

/* ═══ tabs ═══ */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -22px 20px;padding:0 22px;
  overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:55;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10.5px;
  letter-spacing:2px;text-transform:uppercase;padding:14px 15px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--acc)}
.tab.on::after{content:'';position:absolute;left:15px;right:15px;bottom:-1px;height:2px;background:var(--acc)}
.tab .nb{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:6px;
  border-radius:8px;background:var(--acc);color:#170f08;font-size:9px;font-weight:700;text-align:center;
  vertical-align:1px}
:root[data-theme="light"] .tab .nb{color:#fff}

/* ═══ generic ═══ */
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:7px}
h1.pt{font-size:25px;font-weight:650;letter-spacing:-.4px;margin-bottom:5px}
h2.st{font-size:16px;font-weight:650;margin-bottom:10px;letter-spacing:-.2px}
p.lede{color:var(--dim);font-size:13.5px;max-width:760px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mono{font-family:var(--mono)}
.hr{height:1px;background:var(--line);margin:18px 0}
.muted{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.pill.acc{border-color:var(--acc);color:var(--acc);background:var(--glow)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.info{border-color:var(--info);color:var(--info)}
.btn{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);
  color:var(--dim);cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;
  align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#160e07;font-weight:700}
:root[data-theme="light"] .btn.pri{color:#fff}
.btn.pri:hover{filter:brightness(1.12);color:#160e07}
:root[data-theme="light"] .btn.pri:hover{color:#fff}
.btn.on{border-color:var(--acc);color:var(--acc);background:var(--glow)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn.sm{padding:6px 10px;font-size:9.5px}

/* ═══ filter bar ═══ */
.fbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--faint);cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--dim);border-color:var(--line2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#160e07;font-weight:700}
:root[data-theme="light"] .chip.on{color:#fff}
.chip .c{opacity:.65;margin-left:4px}
.fsep{width:1px;height:20px;background:var(--line);margin:0 4px}
select.sel{font-family:var(--mono);font-size:10px;letter-spacing:1px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 10px;cursor:pointer;outline:none}

/* ═══ jobs layout ═══ */
.jgrid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;align-items:start}
@media(max-width:1050px){.jgrid{grid-template-columns:1fr}.jdetail{position:static!important}}
.jlist{display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 190px);overflow-y:auto;padding-right:6px}
.jlist::-webkit-scrollbar{width:5px}
.jlist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.jcard{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:10px;padding:12px 13px;cursor:pointer;transition:.14s;position:relative}
.jcard:hover{border-color:var(--line2);transform:translateX(2px)}
.jcard.on{border-color:var(--acc);border-left-color:var(--acc);background:var(--card2);box-shadow:0 0 0 1px var(--acc)}
.jcard .jt{font-size:13.5px;font-weight:620;line-height:1.35;margin-bottom:3px;padding-right:52px}
.jcard .jc{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.4px;margin-bottom:7px}
.jcard .jm{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.jcard .pay{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:11px;
  font-weight:700;color:var(--acc);text-align:right;line-height:1.2}
.jcard .pay small{display:block;font-size:8px;color:var(--faint);font-weight:400;letter-spacing:.6px}
.jcard .savedot{position:absolute;bottom:11px;right:12px;font-size:11px;color:var(--acc)}
.newdot{position:absolute;top:-4px;left:-4px;width:8px;height:8px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 3px var(--bg)}

/* ═══ detail ═══ */
.jdetail{position:sticky;top:118px;max-height:calc(100vh - 138px);overflow-y:auto}
.jdetail::-webkit-scrollbar{width:5px}
.jdetail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dhead .dt{flex:1;min-width:240px}
.dhead h2{font-size:22px;font-weight:660;line-height:1.25;letter-spacing:-.4px;margin-bottom:6px}
.dhead .dco{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.5px;
  cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.dhead .dco:hover{color:var(--acc)}
.paybox{flex:0 0 auto;text-align:right;background:var(--card2);border:1px solid var(--acc);
  border-radius:10px;padding:10px 14px;min-width:158px}
.paybox .pv{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--acc);line-height:1.15;letter-spacing:-.5px}
.paybox .pl{font-family:var(--mono);font-size:8.5px;letter-spacing:1.8px;color:var(--faint);text-transform:uppercase;margin-top:3px}
.paybox .pinr{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px}
.dgrid{display:grid;grid-template-columns:1fr 268px;gap:16px;align-items:start}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:118px 1fr;gap:5px 12px;font-size:12.5px}
.kv .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--faint);padding-top:2px}
.kv .v{color:var(--txt)}
h4.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--acc);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
ul.li{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.li li{position:relative;padding-left:17px;font-size:12.8px;color:var(--dim);line-height:1.5}
ul.li li::before{content:'';position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--acc);opacity:.7}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.sk{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:6px;background:var(--card2);
  border:1px solid var(--line);color:var(--dim);letter-spacing:.3px}
.sk.hit{border-color:var(--acc);color:var(--acc)}

/* countdown */
.cdown{display:flex;gap:8px;margin:12px 0}
.cdu{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 0;
  text-align:center;flex:1;min-width:52px}
.cdu b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--txt);line-height:1.1}
.cdu span{font-family:var(--mono);font-size:8px;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase}
.cdown.urgent .cdu{border-color:var(--bad)}
.cdown.urgent .cdu b{color:var(--bad)}
.cdown.soon .cdu{border-color:var(--warn)}
.cdown.soon .cdu b{color:var(--warn)}

/* tracker */
.trk{display:flex;gap:5px;flex-wrap:wrap}
.trkb{flex:1;min-width:66px;font-family:var(--mono);font-size:9px;letter-spacing:1.1px;text-transform:uppercase;
  padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--faint);
  cursor:pointer;transition:.14s;text-align:center}
.trkb:hover{border-color:var(--line2);color:var(--dim)}
.trkb.on{font-weight:700}
.trkb.on[data-s="applied"]{border-color:var(--info);color:var(--info);background:rgba(91,141,239,.11)}
.trkb.on[data-s="interviewing"]{border-color:var(--warn);color:var(--warn);background:rgba(240,182,74,.11)}
.trkb.on[data-s="offer"]{border-color:var(--ok);color:var(--ok);background:rgba(62,224,143,.11)}
.trkb.on[data-s="rejected"]{border-color:var(--bad);color:var(--bad);background:rgba(255,90,99,.11)}
textarea.note{width:100%;min-height:74px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;color:var(--txt);font-family:var(--sans);font-size:12.5px;padding:10px;
  outline:none;resize:vertical;transition:.15s}
textarea.note:focus{border-color:var(--acc)}

/* side rail (CV checklist) */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.railcard{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.railcard h5{font-family:var(--mono);font-size:9px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--acc);margin-bottom:10px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:12px;
  color:var(--dim);line-height:1.45;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .bx{flex:0 0 15px;width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;
  margin-top:2px;display:grid;place-items:center;font-size:9px;color:transparent;transition:.14s}
.chk.on .bx{background:var(--acc);border-color:var(--acc);color:#160e07}
:root[data-theme="light"] .chk.on .bx{color:#fff}
.chk.on{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:11px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}

/* compare tray */
#tray{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:18px;z-index:80;
  background:var(--card);border:1px solid var(--acc);border-radius:13px;padding:11px 14px;
  display:flex;gap:11px;align-items:center;box-shadow:var(--shadow);transition:transform .3s;max-width:94vw}
#tray.on{transform:translateX(-50%) translateY(0)}
#tray .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--faint);text-transform:uppercase}
.tchip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:4px 6px 4px 10px;font-size:11px;max-width:190px}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip b{cursor:pointer;color:var(--faint);font-weight:400;padding:0 3px}
.tchip b:hover{color:var(--bad)}

/* modal */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(4,2,8,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:22px}
#scrim.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;max-width:1180px;width:100%;
  max-height:88vh;overflow-y:auto;padding:24px;position:relative;box-shadow:var(--shadow)}
.modal .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
.modal .x:hover{color:var(--bad);border-color:var(--bad)}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.cmp th,table.cmp td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--faint);width:130px;white-space:nowrap}
table.cmp td.best{color:var(--acc);font-weight:600}
table.cmp thead td{font-weight:650;font-size:13.5px;color:var(--txt)}

/* generic grids */
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.cocard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;
  cursor:pointer;transition:.15s}
.cocard:hover{border-color:var(--acc);transform:translateY(-2px)}
.logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);
  font-weight:700;font-size:14px;letter-spacing:.5px;color:#fff;flex:0 0 42px;margin-bottom:10px}
.evt{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;transition:.15s}
.evt:hover{border-color:var(--line2)}
.evd{flex:0 0 58px;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:7px 0;height:fit-content}
.evd b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--acc);line-height:1}
.evd span{font-family:var(--mono);font-size:8.5px;letter-spacing:1.6px;color:var(--faint);text-transform:uppercase}
.brief{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.15s}
.brief:hover{border-color:var(--line2)}
.brief h3{font-size:15px;font-weight:640;margin-bottom:6px;line-height:1.35}

/* history block */
.hist{background:linear-gradient(135deg,var(--glow),transparent 70%),var(--card);
  border:1px solid var(--acc);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;position:relative;overflow:hidden}
.hist canvas{position:absolute;right:0;top:0;height:100%;width:190px;opacity:.4;pointer-events:none}
.hist .hy{font-family:var(--mono);font-size:31px;font-weight:700;color:var(--acc);line-height:1;letter-spacing:-1px}
.hist .ht{font-size:14px;font-weight:600;margin:6px 0 3px;max-width:76%}
.hist .hd{font-size:12.5px;color:var(--dim);max-width:76%}

/* digest */
.dgcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px}
.dgnum{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--acc);line-height:1}
.dglab{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:4px}
.empty{text-align:center;padding:52px 20px;color:var(--faint);font-size:13px}
.empty .e1{font-family:var(--mono);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:8px;color:var(--dim)}
.note-bar{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:9px;padding:11px 14px;font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.5}
.note-bar b{color:var(--txt)}
.srchres{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;

/* ── SECTOR BRIEFS (evergreen career explainers, not live news) ── */
const BRIEFS = [
  {id:'b01',t:'The type endorsement is the steepest step in an AME career',cat:'Maintenance',added:'2026-07-24',
   sum:'A newly licensed AME without a type endorsement sits in the \u20b928,000\u2013\u20b940,000 band at an MRO. Add an A320 or B737 endorsement and the same person moves into the \u20b940,000\u2013\u20b970,000 band, often within the same year.',
   body:'The AME salary curve is not linear and it is not primarily driven by years served. It is driven by endorsements. Public 2026 salary reporting consistently shows the same shape: a fresh licence holder without a type endorsement starts around \u20b928,000\u2013\u20b940,000 per month at an MRO, and the single largest jump in the whole career arc happens when the first aircraft type is added to the licence \u2014 commonly from around \u20b935,000 to around \u20b970,000 within the first two years.\n\nThe practical implication for a student is that the choice of first employer should be made on the endorsement route it offers, not on the starting figure. An MRO paying \u20b95,000 a month less but putting you on an A320 line within eighteen months is worth substantially more over five years than an employer paying slightly better with no type exposure. Ask about documented on-job training on a specific type before accepting, and get the answer in writing.\n\nDual-category holders \u2014 B1.1 combined with B2 \u2014 are a thinner supply pool and typically command 20\u201325% above single-category peers at entry, particularly in offshore and defence work.'},
  {id:'b02',t:'Why Gulf cabin crew pay is not comparable to the Indian figure',cat:'Cabin Crew',added:'2026-07-21',
   sum:'An Emirates fresher on around AED 10,800 a month is not simply earning four times an IndiGo fresher. The comparison has to be made after tax, accommodation, transport and medical cover.',
   body:'Comparing a domestic Indian cabin crew salary against a Gulf carrier salary using the headline numbers alone gives the wrong answer in both directions.\n\nThe Gulf figure is tax-free, and furnished accommodation, transport to and from the airport, and medical cover are provided. Against a domestic Indian package, where rent in a base city can consume a third of a fresher\u2019s take-home, the effective gap is wider than the raw ratio suggests. On reported 2026 figures, an Emirates fresher\u2019s monthly cash after typical personal expenses lands substantially above what a domestic fresher retains.\n\nWhat the headline figure hides in the other direction is variability and lifestyle cost. Gulf pay is built from a fixed base plus a per-flying-hour rate plus layover per diem \u2014 the base component alone is a much smaller share than most applicants expect. A light roster month is a materially lighter pay month. There is also relocation, distance from family, and a probation period during which termination is straightforward.\n\nThe honest framing for a student: the Gulf route is a savings vehicle, and it works best when treated as a defined three-to-five year plan with a savings target attached, not as a permanent relocation decided on a headline number.'},
  {id:'b03',t:'CATIA V5 is the single most screened skill in Indian aerospace ER&D',cat:'Engineering',added:'2026-07-25',
   sum:'For entry-level design roles at the engineering services firms, CATIA proficiency is frequently the first filter applied to a CV \u2014 ahead of the degree classification.',
   body:'India\u2019s aerospace engineering and R&D services sector \u2014 Cyient, L&T Technology Services, Tata Technologies, HCL and a long tail of tier-twos \u2014 is the largest single employer of fresh aerospace and mechanical graduates in the country. It is also the most accessible: the \u20b94\u20138 LPA entry band is lower than the OEM captive centres, but the volume of hiring is far greater.\n\nThe screening is unusually concrete. For a design or drafting role, the recruiter is checking for demonstrable CATIA V5 capability, GD&T literacy, and enough strength of materials to size a bracket by hand. A portfolio of modelled parts with properly applied constraints and a drawing sheet with correct tolerancing does more than a percentage point of CGPA.\n\nThe advice that follows is unglamorous: build the portfolio before you need it, keep the sketches fully constrained, and be able to talk through the tolerance stack-up on at least one part you modelled yourself. The CATIA V5 module in this suite covers the ten experiments that map onto the syllabus \u2014 the point of doing them is that you can then show them.'},
  {id:'b04',t:'The GATE paper decides more of an aerospace career than most students realise',cat:'Government',added:'2026-07-18',
   sum:'ISRO Scientist/Engineer SC, HAL Management Trainee, DRDO Scientist B and several AAI cadres all route through GATE. One exam, four employers, one attempt a year.',
   body:'The concentration of Indian aerospace public-sector recruitment around a single annual examination is the most important structural fact in a government-track career plan, and it is routinely underweighted by students who treat GATE as an M.Tech admission test.\n\nISRO shortlists for Scientist/Engineer SC using GATE scores in the notified papers. HAL recruits Management Trainees through GATE. DRDO uses GATE alongside its own selection test. Several AAI Junior Executive disciplines require a valid GATE score. The pay outcomes are strong \u2014 Level 10 entry at ISRO and DRDO carries a basic of \u20b956,100 with in-hand typically \u20b970,000\u2013\u20b985,000, and the AAI E-1 scale runs \u20b940,000\u2013\u20b91,40,000 with a CTC around \u20b913 lakh \u2014 but the funnel is narrow and it opens once a year.\n\nTwo planning consequences. First, if the government track is a serious option, GATE preparation has to start in the third year, not after graduation, because the notification cycles do not wait. Second, a GATE score is valid for three years, which means one good score can be used across multiple notification cycles \u2014 the single highest-leverage exam outcome available to an Indian aerospace undergraduate.'},
  {id:'b05',t:'What a flying-hour allowance actually does to a pilot\u2019s monthly pay',cat:'Flight Crew',added:'2026-07-16',
   sum:'A First Officer\u2019s pay is a fixed component plus an hourly rate. The same person on the same contract can see a materially different figure between a 50-hour month and a 90-hour month.',
   body:'Airline pilot compensation in India is not a salary in the ordinary sense. It is a fixed monthly component plus a flying-hour allowance, and in the low-cost model the variable part carries a large share of the total.\n\n2026 reporting puts an IndiGo First Officer flying around 50 hours at approximately \u20b92.6 lakh for the month, with the same person closer to the top of the \u20b91.8L\u2013\u20b93.5L band at around 90 hours. The fixed component alone is far lower than either figure. Layover per diem on international sectors adds \u20b93,000\u2013\u20b98,000 per day on top, which is why wide-body assignment at a full-service carrier changes the picture more than the grade alone suggests.\n\nThe consequences are practical. A quiet season, a medical grounding, a training month or a fleet transition all reduce hours and therefore reduce pay. Financial planning against the top of the published band is a mistake; plan against the fixed component plus a conservative hours assumption, and treat the rest as variable.\n\nThe same structure explains why command upgrade is the dominant financial event in the career. Captain bands of \u20b95\u2013\u20b910 lakh per month reflect both a higher fixed component and a higher hourly rate applied to the same roster.'},
  {id:'b06',t:'Ground handling is hiring at volume, and it is the fastest route to an airside pass',cat:'Ground Ops',added:'2026-07-22',
   sum:'A fifteen-year ground handling licence at Bengaluru alone carries a plan for roughly a thousand new hires over three years. Entry pay is modest; access to the industry is immediate.',
   body:'Ground handling is the least glamorous and most accessible entry point in Indian aviation, and in 2026 it is hiring harder than at any point in recent memory. Menzies Aviation secured a fifteen-year ground handling licence at Kempegowda International Airport Bengaluru effective April 2026, with a stated plan to hire approximately a thousand people over three years and invest over nine million dollars in ground support equipment. AISATS and \u00c7elebi run frequent walk-in drives across major stations, accepting both freshers and experienced candidates.\n\nThe pay is what it is: \u20b915,000\u2013\u20b925,000 a month for freshers, \u20b925,000\u2013\u20b940,000 with a few years, \u20b940,000\u2013\u20b960,000 at supervisory level. Nobody should take this role for the starting figure.\n\nThe reason to take it is the airside pass and the operational literacy. A candidate who has spent eighteen months on a ramp understands turnaround pressure, load instructions, FOD discipline and airside safety in a way that no classroom conveys \u2014 and those are precisely the things airline operations, dispatch and safety departments screen for when they hire internally. The people who do well from a ground handling start are the ones who treat it as an eighteen-month entry ticket with a specific next move already identified.'},
  {id:'b07',t:'The drone certificate is cheap; the data skill is what gets paid',cat:'Drone / UAV',added:'2026-07-19',
   sum:'A DGCA Remote Pilot Certificate puts you in the \u20b925,000\u2013\u20b945,000 band. Being able to process what the drone captured is what moves you past \u20b91 lakh a month.',
   body:'India\u2019s drone sector has moved decisively past the pilot-project stage. The 2021 Drone Rules created a stable regulatory framework, the production-linked incentive scheme built a domestic manufacturing base, and large-corporate adoption in agriculture, infrastructure and logistics crossed into operational deployment. Government schemes are adding thousands of operator roles.\n\nThe certification itself is straightforward: minimum age 18, Class 10 with English literacy, a DGCA Class 2 medical, and training at an approved RPTO. The certificate is valid for ten years.\n\nWhat the 2026 salary reporting shows clearly is that the certificate alone caps you. Freshly certified pilots sit at \u20b925,000\u2013\u20b945,000 a month. The same certificate plus demonstrable data-handling capability \u2014 NDVI mapping, photogrammetry, GIS output, inspection analytics \u2014 starts nearer \u20b960,000, and senior pilots in infrastructure inspection, defence and logistics regularly clear \u20b91 lakh a month.\n\nThe conclusion is uncomfortable for anyone hoping the flying is the job: the flying is the commodity, and the analysis is the product. Budget as much learning time for the processing software as for the airframe.'},
  {id:'b08',t:'Read the closing date before you read the salary',cat:'Applications',added:'2026-07-26',
   sum:'Government aviation notifications run on fixed windows that do not reopen. A missed AAI or ISRO deadline costs a year, not a week.',
   body:'The single most avoidable career mistake in Indian aviation recruitment is missing a window. Private sector openings are rolling and forgiving \u2014 an airline that closes a cabin crew drive in August will run another one. Government and PSU notifications are not.\n\nAAI conducts Junior Executive recruitment every two to three years. ISRO\u2019s ICRB notification is annual and the apprentice intakes have single-day walk-in dates with no alternative submission mode. VSSC states plainly that applications are accepted strictly on the day of the selection drive. A candidate who was eligible, prepared and one day late is simply not in the process.\n\nThe practical discipline is unglamorous: when a notification opens, apply immediately rather than waiting to perfect the application, keep original certificates and self-attested copies in a single physical folder ready to carry, and check whether the drive requires portal registration in advance \u2014 several apprenticeship intakes require prior NATS/BOAT registration that itself takes days to clear.\n\nThe deadline tracker in this module exists for exactly this reason. Save the listings you care about and check the countdown weekly.'}
];

function unit(v,cur){
  if(cur==='INR'){
    if(v>=1e7) return (v/1e7).toFixed(2).replace(/\.?0+$/,'')+'Cr';
    if(v>=1e5) return (v/1e5).toFixed(2).replace(/\.?0+$/,'')+'L';
    if(v>=1000) return Math.round(v/1000)+'K';
    return String(v);
  }
  return v.toLocaleString('en-US');
}
function money(j,short){
  const s=SYM[j.cur], p=j.per==='mo'?'/mo':'/yr';
  if(j.min===j.max) return s+unit(j.min,j.cur)+p;
  return s+unit(j.min,j.cur)+'\u2013'+(j.cur==='INR'?'':s)+unit(j.max,j.cur)+p;
}
/* comparable annual INR, for sorting and side-by-side */
function inrYear(j){
  const min=j.salaryMin, max=j.salaryMax; if(!min&&!max) return 0;
  const mid=((min||max)+(max||min))/2, mult=j.salaryPer==='mo'?12:j.salaryPer==='hr'?2000:1;
  return Math.round(mid*mult*(FX[j.salaryCur]||1));
}
function inrNote(j){
  if(j.cur==='INR') return '';
  return '\u2248 \u20b9'+unit(Math.round(inrYear(j)/12),'INR')+'/mo equivalent';
}

   ══════════════════════════════════════════════════════════════════════ */
(function bg(){
  const cv=$('#bgfx'); const c=cv.getContext('2d'); let W,H,T=0,pts=[];
  function fit(){ const d=Math.min(2,devicePixelRatio||1);
    W=cv.width=innerWidth*d; H=cv.height=innerHeight*d;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; c.setTransform(d,0,0,d,0,0);
    pts=[]; const n=Math.round(innerWidth*innerHeight/26000);
    for(let i=0;i<n;i++) pts.push({x:Math.random(),y:Math.random(),
      s:(0.006+Math.random()*0.02)*(Math.random()>.5?1:-1),r:0.6+Math.random()*1.5,a:0.1+Math.random()*0.35});
  }
  addEventListener('resize',fit); fit();
  function draw(){ T+=0.006;
    const w=innerWidth,h=innerHeight; c.clearRect(0,0,w,h);
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#ff9e64';
    // horizon arcs
    c.strokeStyle=acc; c.globalAlpha=.05; c.lineWidth=1;
    for(let i=1;i<=4;i++){ c.beginPath(); c.arc(w*0.5,h*1.35,h*(0.45+i*0.22),Math.PI*1.15,Math.PI*1.85); c.stroke(); }
    c.globalAlpha=1;
    pts.forEach(p=>{ p.x+=p.s*0.0011; if(p.x>1.05)p.x=-.05; if(p.x<-.05)p.x=1.05;
      const x=p.x*w, y=p.y*h;
      c.globalAlpha=p.a*(0.55+0.45*Math.sin(T*1.4+p.y*9));
      c.fillStyle=acc; c.beginPath(); c.arc(x,y,p.r,0,7); c.fill(); });
    c.globalAlpha=1; requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

  if(k==='events') return EVENTS.filter(e=>isNewer(e.added,SEEN.events)).length;
  if(k==='briefs') return BRIEFS.filter(b=>isNewer(b.added,SEEN.briefs)).length;
  return 0;
}
function paintTabs(){
  $('#tabs').innerHTML=TABS.map(t=>{
    const n=newCount(t.k);
    return '<button class="tab'+(TAB===t.k?' on':'')+'" data-t="'+t.k+'">'+t.n+
      (n?'<span class="nb" title="New since your last visit">'+n+'</span>':'')+'</button>';
  }).join('');
  $$('#tabs .tab').forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(k){
  TAB=k; GQ=''; $('#gq').value='';
  if(VISIT[k]!==undefined){ VISIT[k]=new Date().toISOString(); store.set('visits',VISIT); }
  paintTabs(); render(); scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════════════════════════════════════════
   ON THIS DAY
   ══════════════════════════════════════════════════════════════════════ */
function todayHist(){
  const k=String(TODAY.getMonth()+1).padStart(2,'0')+'-'+String(TODAY.getDate()).padStart(2,'0');
  let hits=HIST.filter(h=>h[0]===k);
  if(hits.length) return {h:hits[Math.floor(Math.random()*hits.length)],exact:true};
  /* nearest calendar day, so the block is never empty */
  const md=s=>{const[m,d]=s.split('-').map(Number); return m*31+d;};
  const now=md(k);
  let best=HIST[0],bd=1e9;
  HIST.forEach(h=>{const d=Math.abs(md(h[0])-now); if(d<bd){bd=d;best=h;}});
  return {h:best,exact:false};
}
function histHTML(){
  const {h,exact}=todayHist();
  const dt=D('2000-'+h[0]).toLocaleDateString('en-GB',{day:'numeric',month:'long'});
  return '<div class="hist"><canvas id="histCv"></canvas>'+
    '<div class="eyebrow">'+(exact?'On this day in aviation':'Nearest date in aviation history')+' \u00b7 '+dt+'</div>'+
    '<div class="hy">'+h[1]+'</div><div class="ht">'+esc(h[2])+'</div><div class="hd">'+esc(h[3])+'</div></div>';
}
function histCanvas(){
  const cv=$('#histCv'); if(!cv) return;
  const c=cv.getContext('2d'); const d=Math.min(2,devicePixelRatio||1);
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  cv.width=r.width*d; cv.height=r.height*d; c.setTransform(d,0,0,d,0,0);
  const W=r.width,H=r.height; let t=0;
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
  (function loop(){ if(!document.body.contains(cv)) return;
    t+=0.012; c.clearRect(0,0,W,H); c.strokeStyle=acc; c.lineWidth=1.1;
    for(let k=0;k<4;k++){ c.globalAlpha=.16+k*.07; c.beginPath();
      for(let x=0;x<=W;x+=4){ const p=x/W;
        const y=H*0.5 + Math.sin(p*5.2 + t*1.5 + k*1.1)*H*0.14*(1-p*0.35) - k*7 + 12;
        x?c.lineTo(x,y):c.moveTo(x,y); }
      c.stroke(); }
    c.globalAlpha=1; requestAnimationFrame(loop);
  })();
}

async function runLive(){
  if(!JOBS_PROXY){ return; }
  LIVE.loading=true; LIVE.error=null; render();
  try{
    const u=JOBS_PROXY.replace(/\/$/,'')+'/jobs?q='+encodeURIComponent(LIVE.q||'aviation')+
      '&where='+encodeURIComponent(LIVE.where||'in');
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(u,{signal:ctrl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error('proxy '+r.status);
    const d=await r.json();
    LIVE.jobs=Array.isArray(d.jobs)?d.jobs:[];
    LIVE.sources=d.sources||null; LIVE.ran=true;
    if(d.degraded && !LIVE.jobs.length) LIVE.error='No live results came back \u2014 the source may be rate-limited, or nothing matched. Try a broader term or another country.';
  }catch(e){
    LIVE.jobs=[]; LIVE.ran=true;
    LIVE.error='Could not reach the live jobs service. '+
      '(If you just deployed the worker, check the URL in JOBS_PROXY and that the API keys are set. Try /health on the worker.)';
  }
  LIVE.loading=false; render();
}
function liveMoney(j){
  if(!j.salaryMin && !j.salaryMax) return null;
  const s=SYM[j.salaryCur]||''; const p=j.salaryPer==='mo'?'/mo':j.salaryPer==='hr'?'/hr':'/yr';
  const u=v=>unit(v,j.salaryCur==='INR'?'INR':'x');
  const body=(j.salaryMin&&j.salaryMax&&j.salaryMin!==j.salaryMax)
    ? s+u(j.salaryMin)+'\u2013'+(j.salaryCur==='INR'?'':s)+u(j.salaryMax)
    : s+u(j.salaryMin||j.salaryMax);
  return body+p+(j.salaryEstimated?' est.':'');
}

/* ---- file parsing (client-side) ---- */
async function rzExtract(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.docx')) return rzDocx(file);
  if(name.endsWith('.pdf'))  return rzPdf(file);
  throw new Error('Unsupported file — upload a PDF or DOCX, or paste the text.');
}
async function rzDocx(file){
  /* DOCX is a zip; pull word/document.xml and strip tags. Uses a tiny inflate via DecompressionStream if present. */
  const buf=await file.arrayBuffer();
  const xml=await unzipDocx(buf);
  if(!xml) throw new Error('Could not read this DOCX. Try “Paste text instead”.');
  let txt=xml.replace(/<w:p[ >]/g,'\n<w:p ').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  txt=txt.replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim();
  return txt;
}
async function unzipDocx(buf){
  /* minimal zip reader: find word/document.xml, inflate with DecompressionStream('deflate-raw') */
  const dv=new DataView(buf); const u8=new Uint8Array(buf);
  const dec=new TextDecoder();
  // scan local file headers (PK\x03\x04)
  for(let i=0;i<u8.length-4;i++){
    if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===0x03&&u8[i+3]===0x04){
      const method=dv.getUint16(i+8,true);
      const compSize=dv.getUint32(i+18,true);
      const nameLen=dv.getUint16(i+26,true);
      const extraLen=dv.getUint16(i+28,true);
      const name=dec.decode(u8.subarray(i+30,i+30+nameLen));
      const dataStart=i+30+nameLen+extraLen;
      if(name==='word/document.xml'){
        const comp=u8.subarray(dataStart,dataStart+compSize);
        if(method===0) return dec.decode(comp);
        if(method===8){
          try{
            const ds=new DecompressionStream('deflate-raw');
            const stream=new Response(comp).body.pipeThrough(ds);
            const out=await new Response(stream).arrayBuffer();
            return dec.decode(new Uint8Array(out));
          }catch(e){ return null; }
        }
      }
    }
  }
  return null;
}
let PDFJS_READY=null;
function loadPdfJs(){
  if(PDFJS_READY) return PDFJS_READY;
  PDFJS_READY=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib);}catch(e){rej(e);} };
    s.onerror=()=>rej(new Error('Could not load the PDF reader (needs internet the first time). Try “Paste text instead”.'));
    document.head.appendChild(s);
  });
  return PDFJS_READY;
}
async function rzPdf(file){
  const pdfjsLib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    out+=tc.items.map(it=>it.str).join(' ')+'\n';
  }
  out=out.replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim();
  if(out.length<40) throw new Error('This PDF has almost no readable text — it may be a scan or image. Use “Paste text instead”.');
  return out;
}

async function runResume(){
  if(!RESUME.text || RESUME.text.trim().length<40){ RESUME.error='Add your résumé first — upload a file or paste the text (at least a few lines).'; render(); return; }
  if(RESUME.mode!=='all' && !RESUME.role){ RESUME.error='Choose a target role, or use “find my best-fit role”.'; render(); return; }
  RESUME.loading=true; RESUME.error=null; render();
  try{
    const roleObj=ROLES.find(r=>r.id===RESUME.role);
    const payload={ resume:RESUME.text.slice(0,24000),
      role:RESUME.role||'best', roleLabel:roleObj?roleObj.n:'Best-fit aviation role' };
    if(RESUME.mode==='all') payload.allRoles=ROLES.map(r=>r.n);
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),45000);
    const res=await fetch(RESUME_PROXY.replace(/\/$/,'')+'/analyze',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal});
    clearTimeout(to);
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||'analysis failed');
    RESUME.result=d;
  }catch(e){
    RESUME.result=null;
    RESUME.error = /abort/i.test(String(e)) ? 'The analysis timed out — try again.' :
      'Could not analyze the résumé. '+(String(e.message||e))+' If you just deployed the worker, check RESUME_PROXY and that the API key is set.';
  }
  RESUME.loading=false; render();
}

function hl(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());

}
function searchView(q){
  const Q=q.toLowerCase().trim();
  const R=[];
  savedList().forEach(j=>{
    const hay=[j.title,j.company,j.location,j.summary,j.source].join(' ').toLowerCase();
    if(hay.includes(Q)) R.push({k:'Saved job',t:j.title,s:j.company+' \u00b7 '+j.location,act:()=>openSaved(j.id)});
  });
  NOTIF.forEach(n=>{
    if((n.org+' '+n.role+' '+n.where+' '+n.note).toLowerCase().includes(Q))
      R.push({k:'Official notification',t:n.role,s:n.org+' \u00b7 closes '+fmtD(n.closes),act:()=>go('jobs')});
  });
  EVENTS.forEach(e=>{
    if((e.t+' '+e.desc+' '+e.loc).toLowerCase().includes(Q))
      R.push({k:'Event',t:e.t,s:fmtD(e.d)+' \u00b7 '+e.loc,act:()=>go('events')});
  });
  BRIEFS.forEach(b=>{
    if((b.t+' '+b.sum+' '+b.body+' '+b.cat).toLowerCase().includes(Q))
      R.push({k:'Brief',t:b.t,s:b.cat+' \u00b7 '+fmtD(b.added),act:()=>briefModal(b.id)});
  });
  Object.keys(NOTES).forEach(id=>{
    const n=NOTES[id]; const j=SAVED[id];
    if(j&&n&&n.toLowerCase().includes(Q))
      R.push({k:'Your note',t:j.title,s:n.slice(0,120),act:()=>openSaved(id)});
  });
  HIST.forEach(h=>{
    if((h[2]+' '+h[3]).toLowerCase().includes(Q))
      R.push({k:'Aviation history \u00b7 '+h[1],t:h[2],s:h[3].slice(0,130),act:null});
  });

  let out='<div class="eyebrow">Search</div><h1 class="pt">'+R.length+' result'+(R.length===1?'':'s')+' for \u201c'+esc(q)+'\u201d</h1>'+
    '<p class="lede">Searching your saved jobs, official notifications, events, briefs, aviation history and your own notes. '+
    'To search live vacancies, use the live search on the Jobs tab.</p>';
  if(!R.length) return out+'<div class="empty"><div class="e1">Nothing found here</div>Try the live search on the Jobs tab for current openings.</div>';
  SR=R;
  out+=R.map((r,i)=>'<div class="srchres" data-r="'+i+'"><div class="sk2">'+esc(r.k)+'</div>'+
    '<div style="font-size:13.5px;font-weight:620;margin-bottom:3px">'+hl(r.t,q)+'</div>'+
    '<div style="font-size:12px;color:var(--dim)">'+hl(r.s,q)+'</div></div>').join('');
  return out;
}

  if(CMP.length<2){ modal('<h2 class="st">Pick at least two</h2><p style="color:var(--dim)">Save or open two or three live jobs and press \u21c4 Compare on each, then come back.</p>'); return; }
  const L=CMP.map(job).filter(Boolean);
  if(L.length<2){ modal('<h2 class="st">Those jobs are no longer loaded</h2><p style="color:var(--dim)">Compare works on live results in the current session and your saved jobs. Save the ones you want to keep, then compare.</p>'); return; }
  const withPay=L.filter(j=>inrYear(j)>0);
  const bestPay=withPay.length?Math.max(...withPay.map(inrYear)):0;
  const payCell=j=>{ const p=liveMoney(j); return p?p:'Not disclosed'; };
  const rows=[
    ['Employer',   j=>esc(j.company)],
    ['Location',   j=>esc(j.location)+(j.remote?' \u00b7 remote':'')],
    ['Source',     j=>esc(j.source||'Saved')],
    ['Type',       j=>KINDLBL[j.kind]||j.kind||'\u2014'],
    ['Posted',     j=>j.posted?fmtD(j.posted):'\u2014'],
    ['Pay',        j=>payCell(j), j=>inrYear(j)>0&&inrYear(j)===bestPay],
    ['Annual \u20b9 equiv.', j=>inrYear(j)?'\u20b9'+unit(inrYear(j),'INR'):'\u2014', j=>inrYear(j)>0&&inrYear(j)===bestPay],
    ['Apply',      j=>j.apply?'<a class="btn pri sm" href="'+esc(j.apply)+'" target="_blank" rel="noopener">Open \u2197</a>':'\u2014']
  ];
  let h='<div class="eyebrow">Side by side</div><h1 class="pt">Comparing '+L.length+' live listings</h1>'+
    '<p class="lede">Pay is normalised to an annual rupee equivalent where a figure exists. Many live listings carry no salary, shown as \u201cnot disclosed\u201d. FX is approximate and tax treatment differs \u2014 a Gulf figure is tax-free, an Indian one is not.</p>'+
    '<table class="cmp"><thead><tr><th></th>'+L.map(j=>'<td>'+esc(j.title)+'</td>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><th>'+r[0]+'</th>'+L.map(j=>{
      const best=r[2]&&r[2](j);
      return '<td'+(best?' class="best"':'')+'>'+r[1](j)+'</td>';}).join('')+'</tr>').join('')+
    '</tbody></table>';
  modal(h);
}

/* ══════════════════════════════════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════════════════════════════════ */
function modal(html){ $('#modalBody').innerHTML=html; $('#scrim').classList.add('on'); wireDelegates(); }
function closeModal(){ $('#scrim').classList.remove('on'); }
$('#modalX').onclick=closeModal;
$('#scrim').onclick=e=>{ if(e.target.id==='scrim') closeModal(); };

/* ══════════════════════════════════════════════════════════════════════
   RENDER ROOT
   ══════════════════════════════════════════════════════════════════════ */
function render(){
  const v=$('#view');
  if(GQ.trim().length>=2){ v.innerHTML=searchView(GQ); }
  else v.innerHTML = TAB==='jobs'?jobsView()
    : TAB==='saved' ?savedView()
    : TAB==='events'?eventsView()
    : TAB==='briefs'?briefsView()
    : TAB==='resume'?resumeView()
    : digestView();
  histCanvas(); paintTray(); wireDelegates();
}
function openSaved(id){
  const j=SAVED[id]; if(!j) return;
  SEL=id; closeModal();
  modal(liveDetail(j));
}

/* ── event delegation, re-bound after every render ───────────────── */
function currentJob(){ return job(SEL); }
function wireDelegates(){
  /* ---- résumé fit controls ---- */
  const rzPick=$('#rzPick'), rzFile=$('#rzFile');
  if(rzPick&&rzFile) rzPick.onclick=()=>rzFile.click();
  if(rzFile) rzFile.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    RESUME.error=null; RESUME.fileName=f.name; RESUME.mode='role'; RESUME.loading=true; render();
    try{ RESUME.text=await rzExtract(f); RESUME.error=null; }
    catch(err){ RESUME.text=''; RESUME.error=String(err.message||err); }
    RESUME.loading=false; render();
  };
  const rzPaste=$('#rzPaste'); if(rzPaste) rzPaste.onclick=()=>{ RESUME.mode=(RESUME.mode==='paste'?'role':'paste'); RESUME.fileName=''; render(); setTimeout(()=>{const t=$('#rzText'); if(t)t.focus();},30); };
  const rzText=$('#rzText'); if(rzText) rzText.oninput=()=>{ RESUME.text=rzText.value; };
  const rzRole=$('#rzRole'); if(rzRole) rzRole.onchange=()=>{ RESUME.role=rzRole.value; if(RESUME.role) RESUME.mode=(RESUME.mode==='all'?'role':RESUME.mode); const hint=$('#rzRoleHint'); if(hint){ const r=ROLES.find(x=>x.id===RESUME.role); hint.textContent=r?r.d:''; } const go=$('#rzGo'); if(go&&RESUME.text) go.disabled=false; };
  const rzAll=$('#rzAll'); if(rzAll) rzAll.onclick=()=>{ RESUME.mode=(RESUME.mode==='all'?'role':'all'); render(); };
  const rzGo=$('#rzGo'); if(rzGo) rzGo.onclick=runResume;
  const rzClear=$('#rzClear'); if(rzClear) rzClear.onclick=()=>{ RESUME.result=null; RESUME.error=null; render(); };

  /* ---- live jobs controls ---- */
  const lq=$('#liveQ'); const lw=$('#liveWhere'); const lgo=$('#liveGo');
  const doLive=()=>{ LIVE.q=(lq?lq.value:'').trim(); LIVE.where=lw?lw.value:'in';
    store.set(LIVEQ_KEY,{q:LIVE.q,where:LIVE.where}); LIVE.on=true; LIVE_SEL=null; runLive(); };
  if(lgo) lgo.onclick=doLive;
  if(lq) lq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); doLive(); } };
  const lh=$('#liveHide'); if(lh) lh.onclick=()=>{ LIVE.ran=false; LIVE.jobs=[]; LIVE.error=null; render(); };
  $$('.jcard[data-live]').forEach(el=>el.onclick=()=>{ LIVE_SEL=el.dataset.live; SEL=el.dataset.live; render(); });

  $$('[data-savedsel]').forEach(el=>el.onclick=()=>openSaved(el.dataset.savedsel));
  $$('[data-brief]').forEach(el=>el.onclick=()=>briefModal(el.dataset.brief));
  $$('.srchres[data-r]').forEach(el=>el.onclick=()=>{ const r=SR[+el.dataset.r]; if(r&&r.act) r.act(); });

  /* SEL points at the live-selected job (grid) or the modal-opened saved job */
  const sel=()=> SEL || LIVE_SEL;

  const sb=$('#saveB'); if(sb) sb.onclick=()=>{
    const id=sel(); const j=job(id); if(!j) return;
    if(isSaved(id)) delete SAVED[id]; else SAVED[id]=j;
    store.set('saved2',SAVED); paintTabs(); render();
    // if we're in a modal (saved detail), refresh it
    if($('#scrim').classList.contains('on')) modal(liveDetail(j));
  };
  const cb=$('#cmpB'); if(cb) cb.onclick=()=>{
    const id=sel(); if(!id) return;
    if(CMP.includes(id)) CMP=CMP.filter(x=>x!==id);
    else { if(CMP.length>=3){ toast('Compare holds three at a time \u2014 drop one first.'); return; } CMP=[...CMP,id]; }
    render();
    if($('#scrim').classList.contains('on')){ const j=job(id); if(j) modal(liveDetail(j)); }
  };
  $$('.trkb[data-s]').forEach(b=>b.onclick=()=>{
    const id=sel(); const j=job(id); if(!j) return;
    const st=b.dataset.s;
    if(st){ TRACK[id]=st; if(!SAVED[id]){ SAVED[id]=j; store.set('saved2',SAVED); } }
    else delete TRACK[id];
    store.set('track',TRACK); render();
    if($('#scrim').classList.contains('on')) modal(liveDetail(j));
  });
  const nb=$('#noteBox'); if(nb){
    let tmr; nb.oninput=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{
      const id=sel(); const j=job(id); if(!j) return;
      const v=nb.value.trim();
      if(v){ NOTES[id]=v; if(!SAVED[id]){ SAVED[id]=j; store.set('saved2',SAVED); } } else delete NOTES[id];
      store.set('notes',NOTES); },350); };
  }
  $$('.chk[data-cv]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.cv; CV[k]=!CV[k]; if(!CV[k]) delete CV[k];
    store.set('cv',CV);
    if($('#scrim').classList.contains('on')){ const j=job(sel()); if(j) modal(liveDetail(j)); } else render();
  });

  const bk=$('#bkB'); if(bk) bk.onclick=()=>{
    const blob=new Blob([JSON.stringify({v:2,saved:SAVED,track:TRACK,notes:NOTES,cv:CV,at:new Date().toISOString()},null,2)],
      {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='ascent-board-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    toast('Board backed up.');
  };
  const rs=$('#rsB'); if(rs) rs.onclick=()=>$('#rsF').click();
  const rf=$('#rsF'); if(rf) rf.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      SAVED=(d.saved&&!Array.isArray(d.saved))?d.saved:{}; TRACK=d.track||{}; NOTES=d.notes||{}; CV=d.cv||{};
      store.set('saved2',SAVED); store.set('track',TRACK); store.set('notes',NOTES); store.set('cv',CV);
      toast('Board restored.'); paintTabs(); render();
    }catch(_){ toast('That file could not be read.'); } };
    r.readAsText(f);
  };
  const wp=$('#wipeB'); if(wp) wp.onclick=()=>{
    if(!confirm('This clears every saved job, application status, note and checklist item in this browser. There is no undo. Continue?')) return;
    SAVED={}; TRACK={}; NOTES={}; CV={};
    store.set('saved2',SAVED); ['track','notes','cv'].forEach(k=>store.set(k,{}));
    toast('Board cleared.'); paintTabs(); render();
  };
}
$('#cmpGo').onclick=compareModal;
$('#cmpClr').onclick=()=>{ CMP=[]; render(); };

/* ── toast ───────────────────────────────────────────────────────── */
let tT;
function toast(msg){
  let el=$('#toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:120;'+
      'background:var(--card);border:1px solid var(--acc);color:var(--txt);border-radius:10px;'+
      'padding:11px 17px;font-size:12.5px;box-shadow:var(--shadow);transition:opacity .25s;max-width:88vw;text-align:center';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(tT); tT=setTimeout(()=>{el.style.opacity='0';},2600);
}

/* ── global search input ─────────────────────────────────────────── */
let sT;
$('#gq').oninput=e=>{ GQ=e.target.value; clearTimeout(sT); sT=setTimeout(render,180); };
addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='/'&&!typing){ e.preventDefault(); $('#gq').focus(); return; }
  if(e.key==='Escape'){
    if($('#scrim').classList.contains('on')){ closeModal(); return; }
    if(typing){ document.activeElement.blur(); if(GQ){ GQ=''; $('#gq').value=''; render(); } }
  }
  if(typing) return;
  if(e.key>='1'&&e.key<='5'){ const t=TABS[+e.key-1]; if(t) go(t.k); }
  if(e.key==='c'&&CMP.length>=2) compareModal();
  if(e.key==='s'&&LIVE_SEL){ const b=$('#saveB'); if(b) b.click(); }
  if((e.key==='j'||e.key==='k')&&TAB==='jobs'&&LIVE.jobs.length){
    const L=LIVE.jobs; const i=L.findIndex(x=>x.id===LIVE_SEL);
    const n=e.key==='j'?Math.min(L.length-1,i+1):Math.max(0,i-1);
    if(L[n]){ LIVE_SEL=L[n].id; SEL=L[n].id; render(); const el=document.querySelector('.jcard[data-live].on'); if(el) el.scrollIntoView({block:'nearest'}); }
  }
});

/* ══════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════ */
(function boot(){
  const steps=[[18,'loading listings'],[42,'indexing salary data'],[66,'restoring your board'],[88,'building calendar'],[100,'ready']];
  let i=0;
  const tick=()=>{
    if(i>=steps.length){
      paintTabs(); go('jobs');
      const b=$('#boot'); b.style.opacity='0'; setTimeout(()=>b.remove(),520);
      if(FIRSTRUN) setTimeout(()=>toast('Press / to search, 1\u20136 for tabs, J/K to move through jobs.'),900);
      return;
    }
    $('#bootBar').style.width=steps[i][0]+'%';
    $('#bootMsg').textContent=steps[i][1];
    i++; setTimeout(tick,170);
  };
  tick();
})();
</script>
