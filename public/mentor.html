h1,h2,h3{margin:0;font-weight:680;letter-spacing:-.015em}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ── app shell ── */
.app{display:flex;min-height:100vh}
.rail{width:230px;flex:none;background:var(--surface);
  border-right:1px solid var(--horizon);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10}
.mark{padding:20px 18px 16px;border-bottom:1px solid var(--horizon);position:relative}
.mark::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand) 30%,var(--horizon) 30%,var(--horizon) 100%)}
.mark::before{content:"";display:block;height:34px;width:100%;max-width:190px;
  background:var(--logo) left center/contain no-repeat;margin-bottom:12px}
.markName{font-family:var(--mono);font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--brand)}
.markSub{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--faint);margin-top:5px;text-transform:uppercase;line-height:1.55}
.nav{padding:12px 10px;flex:1}
.navLabel{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;padding:10px 12px 6px}
.navItem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--dim);
  font-size:13.5px;font-weight:500;transition:all .14s;margin-bottom:2px;position:relative}
.navItem:hover{background:var(--surface2);color:var(--ink)}
.navItem.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.navItem.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.navIco{width:17px;text-align:center;font-size:14px}
.railFoot{padding:12px;border-top:1px solid var(--horizon);display:flex;flex-direction:column;gap:6px}
.ghost{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;text-align:left;
  background:var(--surface);border:1px solid var(--horizon);border-radius:9px;padding:9px 11px;color:var(--dim);cursor:pointer;transition:.14s}
.ghost:hover{border-color:var(--text-muted,var(--faint));background:var(--surface2);color:var(--ink)}

.stage{flex:1;min-width:0;padding:28px 34px 80px;max-width:1320px}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--brand);text-transform:uppercase;margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--brand);display:inline-block}
.title{font-size:27px;line-height:1.08;letter-spacing:-.02em}
.lede{color:var(--dim);font-size:13.5px;margin-top:7px;max-width:640px}

/* ── instrument tiles → dashboard KPIs ── */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px;margin-bottom:26px}
.gauge{border:1px solid var(--horizon);border-radius:16px;padding:17px 19px;background:var(--surface);position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .16s,box-shadow .16s}
.gauge:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.gauge::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accentc,var(--cyan))}
.gauge::after{display:none}
.gauge.c-amber{--accentc:var(--amber)} .gauge.c-red{--accentc:var(--brand)} .gauge.c-green{--accentc:var(--climb)} .gauge.c-violet{--accentc:var(--violet)}
.gNum{font-family:var(--sans);font-size:33px;font-weight:660;line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.gLab{font-family:var(--sans);font-size:12px;letter-spacing:.01em;color:var(--dim);text-transform:none;margin-top:9px}
.gSub{font-size:11.5px;color:var(--faint);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── panels → cards ── */
.panel{border:1px solid var(--horizon);border-radius:16px;background:var(--surface);padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.panelTitle{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:9px;letter-spacing:-.005em}
.panelTitle .dotc{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}

/* ── toolbar / inputs ── */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.field{background:var(--surface);border:1px solid var(--horizon2);border-radius:9px;padding:8px 12px;color:var(--ink);font-size:13.5px;font-family:inherit;transition:border-color .14s}
.field:hover{border-color:var(--faint)}
.field:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--accent-soft,rgba(42,120,214,.15))}
.field::placeholder{color:var(--faint)}
select.field{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2382817b' fill='none' stroke-width='1.4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
label.fl{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px}
textarea.field{width:100%;resize:vertical;min-height:70px;line-height:1.55}

.btn{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;cursor:pointer;
  border:1px solid var(--horizon2);border-radius:9px;padding:9px 15px;background:var(--surface);color:var(--ink);
  transition:all .14s;font-weight:550}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--brand);color:#fff;border:none;font-weight:600;box-shadow:var(--shadow-sm)}
.btn.go:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.amber{background:var(--amber);color:#3d2600;border:none;font-weight:600}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger:hover{border-color:var(--descent);color:var(--descent);background:var(--brand-soft)}

/* ── student cards / grid → dashboard cluster cards ── */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.strip{border:1px solid var(--horizon);border-radius:16px;background:var(--surface);padding:16px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;overflow:hidden}
.strip:hover{transform:translateY(-3px);border-color:var(--horizon2);box-shadow:var(--shadow-lg)}
.stripTop{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.badge{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep))}
.badge.risk{background:linear-gradient(135deg,var(--descent),#b8362f)}
.badge.new{background:linear-gradient(135deg,var(--amber),var(--amber-deep))}
.sName{font-size:14px;font-weight:650;line-height:1.2}
.sReg{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
/* trajectory bar — signature element retained */
.traj{height:6px;border-radius:4px;background:var(--surface3,var(--horizon));position:relative;overflow:hidden;margin:12px 0 9px}
.trajFill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--cyan);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.trajFill.risk{background:var(--descent)}
.trajFill.new{background:var(--amber)}
.trajMeta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-family:var(--sans);font-size:11px;letter-spacing:0;padding:3px 9px;border-radius:20px;border:1px solid var(--horizon2);color:var(--dim);white-space:nowrap;font-weight:500}
.chip.goal{color:var(--cyan);border-color:var(--cyan)}
.chip.risk{color:var(--descent);border-color:var(--descent);background:transparent}
.chip.ok{color:var(--climb);border-color:var(--climb)}
.chip.new{color:var(--amber-deep);border-color:var(--amber)}

.empty{text-align:center;padding:40px;color:var(--faint);font-size:13.5px}
.empty .e1{font-size:15px;color:var(--dim);margin-bottom:7px}

/* ── toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--surface);border-radius:11px;padding:12px 20px;font-size:13.5px;
  transition:.25s cubic-bezier(.2,.8,.2,1);z-index:300;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ── profile view ── */
.profileTop{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--horizon)}
.pBadge{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:700;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep))}
.pBadge.risk{background:linear-gradient(135deg,var(--descent),#b8362f)} .pBadge.new{background:linear-gradient(135deg,var(--amber),var(--amber-deep))}
.pInfo{flex:1;min-width:220px}
.pName{font-size:22px;font-weight:700;letter-spacing:-.015em}
.pReg{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:.02em}
.pContact{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
.pContact span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pContact b{color:var(--dim);font-weight:500}
.backBtn{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;color:var(--dim);
  background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:7px}
.backBtn:hover{color:var(--brand)}

/* big trajectory readout on profile */
.glidepath{border:1px solid var(--horizon);border-radius:16px;background:var(--surface2);padding:20px;margin-bottom:18px}
.glideLabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.glideTrack{height:10px;border-radius:6px;background:var(--surface3,var(--horizon2));position:relative;overflow:hidden}
.glideFill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--cyan);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.glideFill.risk{background:var(--descent)}
.glideFill.new{background:var(--amber)}
.glideStat{display:flex;justify-content:space-between;margin-top:12px;align-items:center;flex-wrap:wrap;gap:10px}
.glidePct{font-family:var(--sans);font-size:22px;font-weight:660;font-variant-numeric:tabular-nums}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* tags/lists inside profile */
.taglist{display:flex;flex-wrap:wrap;gap:7px}
.taglist .t{font-size:12.5px;padding:5px 11px;border-radius:20px;background:var(--surface2);border:1px solid var(--horizon2);display:inline-flex;align-items:center;gap:7px;color:var(--dim)}
.taglist .t.strength{border-color:var(--climb);color:var(--climb)}
.taglist .t.weak{border-color:var(--amber);color:var(--amber-deep)}
.taglist .t.skill{border-color:var(--violet);color:var(--violet)}
.taglist .t x{cursor:pointer;color:var(--faint);font-size:13px;line-height:1}
.taglist .t x:hover{color:var(--descent)}
.addRow{display:flex;gap:8px;margin-top:12px}
.addRow .field{flex:1}

/* POA waypoints */
.waypoint{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--horizon)}
.waypoint:last-child{border-bottom:none}
.wpCheck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--horizon2);flex:none;cursor:pointer;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.14s;color:transparent;font-size:12px}
.wpCheck:hover{border-color:var(--cyan)}
.wpCheck.done{background:var(--climb);border-color:var(--climb);color:#fff}
.wpBody{flex:1;min-width:0}
.wpText{font-size:13.5px;line-height:1.5}
.wpText.done{color:var(--faint);text-decoration:line-through}
.wpMeta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:4px;display:flex;gap:10px;align-items:center}
.wpMeta .overdue{color:var(--descent)}
.wpDel{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;flex:none}
.wpDel:hover{color:var(--descent)}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--horizon)}
.tlItem{position:relative;padding:0 0 20px 0}
.tlItem::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--cyan);box-shadow:0 0 0 3px var(--surface)}
.tlItem:last-child{padding-bottom:0}
.tlDate{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--cyan);text-transform:uppercase;margin-bottom:5px}
.tlNotes{font-size:13.5px;line-height:1.55;color:var(--ink)}
.tlSub{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.tlSub b{color:var(--dim);font-weight:600}

/* ── modal ── */
.scrim{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(17,17,16,.55);backdrop-filter:blur(6px)}
.scrim[hidden]{display:none!important}
.modal{position:relative;width:min(560px,95vw);max-height:86vh;overflow:auto;border:1px solid var(--horizon2);border-radius:18px;
  background:var(--surface);padding:26px;box-shadow:var(--shadow-lg);
  animation:mIn .35s cubic-bezier(.2,.9,.25,1.05)}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.mClose{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;line-height:1}
.mClose:hover{color:var(--ink)}
.field.full{width:100%;margin-bottom:12px}

@media(max-width:820px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .mark{border-bottom:none;border-right:1px solid var(--horizon)}
  .mark::before{display:none}.mark::after{display:none}
  .nav{display:flex;flex:1;padding:8px;overflow-x:auto;align-items:center}
  .navLabel{display:none} .navItem{white-space:nowrap;margin-bottom:0}
  .railFoot{flex-direction:row;border-top:none}
  .stage{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Stage 3 analytics */
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.heatCell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--horizon);transition:transform .12s,box-shadow .12s;position:relative}
.heatCell:hover{transform:scale(1.1);box-shadow:var(--shadow);z-index:2;border-color:var(--cyan)}
.heatInit{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.heatKey{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:9px;color:var(--faint)}
.heatGrad{flex:1;height:7px;border-radius:4px;background:linear-gradient(90deg,#cde2fb,#6da7ec,#184f95)}
.trackRow{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--horizon);cursor:pointer;transition:padding-left .14s}
.trackRow:last-child{border-bottom:none}
.trackRow:hover{padding-left:6px}

/* rated skills */
.skillRow{border:1px solid var(--horizon);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:var(--surface2)}
.skillTop{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.skillName{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.skillLvl{display:flex;align-items:center;gap:5px}
.lvlDot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--horizon2);cursor:pointer;transition:.14s;background:transparent}
.lvlDot:hover{border-color:var(--cyan)}
.lvlDot.on{background:var(--cyan);border-color:var(--cyan)}
.lvlLabel{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.03em;margin-left:6px;min-width:64px}
.skillNote{width:100%;font-size:12.5px;padding:8px 10px}
.addSkillRow{display:flex;gap:8px;margin-top:12px}

/* AI assist */
.aiSpin{width:32px;height:32px;border-radius:50%;border:3px solid var(--horizon);border-top-color:var(--violet);animation:aiSpin .8s linear infinite;margin:0 auto}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.aiPick{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--horizon);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface2)}
.aiPick:hover{border-color:var(--violet)}
.aiPick input{margin-top:3px;accent-color:var(--violet)}
.aiPick span{font-size:13.5px;line-height:1.5}

/* Stage 5 section dividers */
.sectionRule{display:flex;align-items:center;gap:14px;margin:26px 0 16px}
.sectionRule::before,.sectionRule::after{content:"";height:1px;background:var(--horizon);flex:1}
.sectionRule span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}

/* Stage 6 · bulk + groups + roadmap + notes */
.segmented{display:inline-flex;border:1px solid var(--horizon2);border-radius:10px;overflow:hidden}
.segBtn{font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none;padding:9px 15px;background:var(--surface);color:var(--dim);border:none;cursor:pointer;transition:.14s;font-weight:550}
.segBtn:hover{color:var(--ink);background:var(--surface2)}
.segBtn.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.bulkHead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--horizon);font-family:var(--sans);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);background:var(--surface2);font-weight:600}
.bulkRow{display:flex;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--horizon);transition:background .12s}
.bulkRow:last-child{border-bottom:none}
.bulkRow:hover{background:var(--surface2)}
.groupGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.groupChip{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--horizon);border-radius:10px;background:var(--surface2);cursor:pointer;transition:.14s}
.groupChip:hover{border-color:var(--cyan);transform:translateY(-1px)}
.roadTrack{height:8px;border-radius:5px;background:var(--horizon2);overflow:hidden}
.roadFill{height:100%;border-radius:5px;background:var(--cyan);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.roadItem .roadDot{position:absolute;left:-22px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--horizon2);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.15s;box-shadow:0 0 0 3px var(--surface)}
.roadItem .roadDot.done{background:var(--climb);border-color:var(--climb)}
.roadItem .roadDot:hover{border-color:var(--cyan)}
.roadItem::before{display:none}
#noteResults mark{background:rgba(42,120,214,.22);color:var(--ink);border-radius:3px;padding:0 2px}

/* ═══ password lock screen ═══ */
.lockScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--void);overflow:hidden}
.lockScreen.unlocked{display:none}
.lockGrid{position:absolute;inset:0;opacity:.6;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 40%,#000,transparent 75%);
          mask-image:radial-gradient(ellipse 60% 55% at 50% 40%,#000,transparent 75%)}
.lockCard{position:relative;width:min(390px,92vw);border:1px solid var(--horizon);border-radius:20px;
  background:var(--surface);padding:32px 30px 26px;box-shadow:var(--shadow-lg);
  animation:lockIn .5s cubic-bezier(.2,.9,.25,1.05)}
.lockCard::after{content:"";position:absolute;left:30px;right:30px;top:0;height:3px;border-radius:0 0 2px 2px;

/* on-screen error reporter — helps diagnose issues on machines we can't inspect */
window.__errs=[];
(function(){
  function banner(msg){
    var b=document.getElementById('__errbar');
    if(!b){ b=document.createElement('div'); b.id='__errbar';
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#d03b3b;color:#fff;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:9px 14px;max-height:42vh;overflow:auto;white-space:pre-wrap;box-shadow:0 -4px 20px rgba(0,0,0,.4)';

    b.onclick=function(){ b.parentNode&&b.parentNode.removeChild(b); };
  }
  window.__banner=banner;
  window.addEventListener('error',function(e){ var m=(e.message||'script error')+(e.filename?(' @line '+e.lineno+':'+e.colno):''); window.__errs.push(m); try{banner(m);}catch(x){} });
  window.addEventListener('unhandledrejection',function(e){ var r=e.reason; var m='promise: '+((r&&r.message)||r||'rejection'); window.__errs.push(m); try{banner(m);}catch(x){} });
})();

<script>
/* independent unlock — self-contained, cannot be broken by other scripts */
(function(){
  var PASS='2000';
  function g(id){return document.getElementById(id);}
  function unlock(){
    var inp=g('lockInput'),scr=g('lockScreen'),msg=g('lockMsg'),ico=g('lockIcon');
    if(!inp||!scr)return;
    var v=(inp.value||'').trim();
    if(v===PASS){try{sessionStorage.setItem('mentor.unlocked','1');}catch(e){}scr.classList.add('unlocked');scr.style.display='none';scr.setAttribute('hidden','');if(msg)msg.textContent='';}
    else{if(msg)msg.textContent='Incorrect passcode';if(ico){ico.classList.add('shake');setTimeout(function(){ico.classList.remove('shake');},400);}inp.value='';try{inp.focus();}catch(e){}}
  }
  window.__mentorUnlock=unlock;
  function init(){
    var inp=g('lockInput'),scr=g('lockScreen'),btn=g('lockBtn');
    var already=false;try{already=sessionStorage.getItem('mentor.unlocked')==='1';}catch(e){}
    if(already&&scr){scr.classList.add('unlocked');scr.style.display='none';scr.setAttribute('hidden','');}
    else if(inp){inp.value='';setTimeout(function(){inp.value='';try{inp.focus();}catch(e){}},80);}
    if(btn){btn.addEventListener('click',unlock);}
    if(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13){e.preventDefault();unlock();}});}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

  cyan:cssVar('--cyan'), climb:cssVar('--climb'), amber:cssVar('--amber'), descent:cssVar('--descent') }; }
let TT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),2200); }
function initials(n){ const p=n.trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p.length>1?p[p.length-1]:'')[0]||''); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function daysSince(iso){ if(!iso) return Infinity; return Math.floor((Date.now()-new Date(iso))/864e5); }
function lastSession(s){ return s.sessions&&s.sessions.length? s.sessions[s.sessions.length-1].date : null; }

/* ── progress + risk model ── */
function progress(s){
  /* a simple, transparent 0-100 "readiness" score from what's been captured */
  let p=0;
  if(s.goal) p+=18;
  if(s.expertise) p+=8;
  if(s.strengths.length) p+=Math.min(12,s.strengths.length*4);
  const rs=s.ratedSkills||[]; if(rs.length){ const avgLvl=rs.reduce((a,r)=>a+(r.level||0),0)/rs.length; p+=Math.min(10,Math.round(avgLvl/5*10)); }
  if(s.sessions.length) p+=Math.min(20,s.sessions.length*7);
  const poaDone=s.poa.filter(x=>x.done).length, poaTot=s.poa.length;
  if(poaTot) p+=Math.round((poaDone/poaTot)*30);
  if(!s.weaknesses.length && s.sessions.length) p+=8; /* no open gaps */
  return Math.max(0,Math.min(100,p));
}
function riskReasons(s){
  const r=[];
  if(!s.goal) r.push('No career goal set');
  if(!s.sessions.length) r.push('No session logged yet');
  else if(daysSince(lastSession(s))>45) r.push('No session in 45+ days');
  const overdue=s.poa.filter(p=>!p.done && p.due && new Date(p.due)<new Date()).length;
  if(overdue) r.push(overdue+' overdue action'+(overdue>1?'s':''));
  if(s.weaknesses.length && !s.poa.length) r.push('Gaps noted, no plan yet');
  return r;
}
function statusOf(s){ if(!s.sessions.length) return 'new'; return riskReasons(s).length?'risk':'ok'; }

/* rated skills UI */
function libOptions(lib,have){
  const set=new Set((have||[]).map(x=>x.toLowerCase()));

}
function skillOptions(s){
  const have=new Set((s.ratedSkills||[]).map(r=>r.skill));
  return SKILL_LIBRARY.filter(sk=>!have.has(sk)).map(sk=>`<option value="${esc(sk)}">${esc(sk)}</option>`).join('');

function suggestSkillsHTML(s){
  const have=new Set((s.ratedSkills||[]).map(r=>r.skill));
  const sug=(ROLE_SKILLS[s.goal]||[]).filter(sk=>!have.has(sk));
  if(!sug.length) return '<span style="font-size:11px;color:var(--faint)">All suggested skills added.</span>';

function ratedSkillsHTML(s){
  const R=s.ratedSkills||[];
  if(!R.length) return '<div class="empty" style="padding:18px"><div class="e1">No skills assessed yet</div>Add a skill below, rate 1–5, and note how they can improve.</div>';
  return R.map((r,i)=>{

    return `<div class="skillRow">
      <div class="skillTop">

function poaHTML(s){
  if(!s.poa.length) return '<div class="empty" style="padding:20px"><div class="e1">No plan yet</div>Add action steps to guide this cadet toward their goal.</div>';

    return `<div class="waypoint">
      <div class="wpCheck ${p.done?'done':''}" data-poa="${i}">${p.done?'✓':''}</div>
      <div class="wpBody"><div class="wpText ${p.done?'done':''}">${esc(p.text)}</div>
      <div class="wpMeta">${p.due?`<span class="${overdue?'overdue':''}">◷ due ${esc(fmtDate(p.due))}${overdue?' · overdue':''}</span>`:''}${p.added?`<span>added ${esc(fmtDate(p.added))}</span>`:''}</div></div>

function wireProfile(){
  const s=DB.students.find(x=>x.id===CURRENT);
  $('#backBtn').onclick=()=>{ CURRENT=null; VIEW='roster'; render(); };
  $('#editBtn').onclick=()=>openEdit(s);
  $('#logForBtn').onclick=()=>openSession(s.id);
  /* tag adders — dropdown + custom */
  const addVal=(arr,val)=>{ val=(val||'').trim(); if(!val) return; if(arr.some(x=>x.toLowerCase()===val.toLowerCase())) { toast('Already added'); return; } arr.push(val); s.updated=new Date().toISOString(); store.save(); render(); };
  const setupPicker=(pickId,customId,btnId,arr)=>{
    const pick=$('#'+pickId), custom=$('#'+customId), btn=$('#'+btnId);
    if(pick) pick.onchange=()=>{ if(pick.value==='__custom'){ custom.style.display='block'; custom.focus(); } else custom.style.display='none'; };
    if(btn) btn.onclick=()=>{ const v = pick.value==='__custom' ? custom.value : pick.value; addVal(arr,v); };
    if(custom) custom.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addVal(arr,custom.value); } });
  };
  setupPicker('pickStrength','addStrength','addStrengthBtn',s.strengths);
  setupPicker('pickWeak','addWeak','addWeakBtn',s.weaknesses);
  /* rated skills */
  const addRated=(name)=>{ if(!name) return; s.ratedSkills=s.ratedSkills||[]; if(s.ratedSkills.some(r=>r.skill===name)) return; s.ratedSkills.push({skill:name,level:0,note:''}); s.updated=new Date().toISOString(); store.save(); render(); };
  $('#addRated')&&($('#addRated').onclick=()=>addRated($('#skillPick').value));
  $$('[data-sug]').forEach(el=>el.onclick=()=>addRated(el.dataset.sug));
  $$('[data-rate]').forEach(d=>d.onclick=()=>{ const [i,n]=d.dataset.rate.split(':').map(Number); const cur=s.ratedSkills[i].level; s.ratedSkills[i].level = (cur===n? n-1 : n); store.save(); render(); });
  $$('[data-note]').forEach(inp=>inp.addEventListener('change',()=>{ s.ratedSkills[+inp.dataset.note].note=inp.value.trim(); store.save(); }));
  $$('[data-skdel]').forEach(b=>b.onclick=()=>{ s.ratedSkills.splice(+b.dataset.skdel,1); store.save(); render(); });
  /* tag removal */
  $$('[data-rm]').forEach(x=>x.onclick=()=>{ const [cls,idx]=x.dataset.rm.split(':'); const map={strength:'strengths',weak:'weaknesses',skill:'skills'}; s[map[cls]].splice(+idx,1); store.save(); render(); });
  /* POA */
  $('#addPoaBtn').onclick=()=>{ const t=$('#addPoa').value.trim(); if(!t) return; s.poa.push({text:t,due:$('#addPoaDue').value||'',done:false,added:new Date().toISOString()}); store.save(); render(); toast('Action added'); };
  $('#addPoa')?.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#addPoaBtn').click(); } });
  $$('[data-poa]').forEach(c=>c.onclick=()=>{ const i=+c.dataset.poa; s.poa[i].done=!s.poa[i].done; store.save(); render(); });
  $$('[data-poadel]').forEach(b=>b.onclick=()=>{ s.poa.splice(+b.dataset.poadel,1); store.save(); render(); });
  /* AI */
  $('#aiPoaBtn')&&($('#aiPoaBtn').onclick=()=>aiSuggestPoa(s.id));
  $('#improveBtn')&&($('#improveBtn').onclick=()=>aiImprove(s.id));
  /* internships + achievements */
  $('#addInternBtn')&&($('#addInternBtn').onclick=()=>openInternForm(s.id));
  $('#addAchieveBtn')&&($('#addAchieveBtn').onclick=()=>openAchieveForm(s.id));
  $$('[data-editintern]').forEach(b=>b.onclick=()=>openInternForm(s.id,+b.dataset.editintern));
  $$('[data-delintern]').forEach(b=>b.onclick=()=>{ s.internships.splice(+b.dataset.delintern,1); store.save(); render(); });
  $$('[data-editach]').forEach(b=>b.onclick=()=>openAchieveForm(s.id,+b.dataset.editach));
  $$('[data-delach]').forEach(b=>b.onclick=()=>{ s.achievements.splice(+b.dataset.delach,1); store.save(); render(); });
}

    if(!notes && !hasUpdates){ toast('Add session notes, or some updates, first'); return; }
    // apply staged updates
    if(QC.goal) s.goal=QC.goal;
    s.strengths=s.strengths||[]; QC.strengths.forEach(t=>{ if(!s.strengths.some(x=>x.toLowerCase()===t.toLowerCase())) s.strengths.push(t); });
    s.weaknesses=s.weaknesses||[]; QC.gaps.forEach(t=>{ if(!s.weaknesses.some(x=>x.toLowerCase()===t.toLowerCase())) s.weaknesses.push(t); });
    s.ratedSkills=s.ratedSkills||[]; QC.skills.forEach(r=>{ if(!s.ratedSkills.some(x=>x.skill===r.skill)) s.ratedSkills.push(r); });
    s.internships=s.internships||[]; QC.interns.forEach(it=>s.internships.push(it));
    s.achievements=s.achievements||[]; QC.achieves.forEach(a=>s.achievements.push(a));
    // log the session (only if notes present; otherwise just updates)
    if(notes){ s.sessions.push({ date:new Date($('#lDate').value||Date.now()).toISOString(), notes,
        progress:$('#lProgress').value.trim(), focus:$('#lFocus').value.trim() });
      s.history=s.history||[]; s.history.push({ ts:new Date().toISOString(), readiness:0, sessions:s.sessions.length, poaDone:s.poa.filter(p=>p.done).length });
    }
    s.updated=new Date().toISOString();
    // fix history readiness after all updates applied
    if(notes && s.history.length) s.history[s.history.length-1].readiness=progress(s);
    store.save();
    toast(notes? 'Session + updates saved for '+tc(s.name) : 'Updates saved for '+tc(s.name));
    openStudent(id);
  };
}

/* momentum: compare recent readiness snapshots to see if a cadet is improving, flat, or slipping */
function momentum(s){
  const h=s.history||[];
  if(h.length<2){
    /* not enough history — infer from recency of engagement */
    if(!s.sessions.length) return {dir:'none',label:'Not started',delta:0};
    return {dir:'new',label:'Baseline set',delta:0};
  }
  const recent=h[h.length-1].readiness, prev=h[Math.max(0,h.length-3)].readiness;
  const delta=recent-prev;
  if(delta>=6) return {dir:'up',label:'Improving',delta};
  if(delta<=-6) return {dir:'down',label:'Slipping',delta};
  return {dir:'flat',label:'Holding steady',delta};
}
function momentumColor(d){ return d==='up'?'var(--climb)':d==='down'?'var(--descent)':d==='flat'?'var(--amber)':'var(--faint)'; }
function momentumArrow(d){ return d==='up'?'▲':d==='down'?'▼':d==='flat'?'▬':'○'; }

/* month key helpers */
function monthKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }

/* aggregate helpers */
function goalDistribution(){ const d={}; DB.students.forEach(s=>{ if(s.goal) d[s.goal]=(d[s.goal]||0)+1; }); return Object.entries(d).sort((a,b)=>b[1]-a[1]); }
function tagFrequency(field){ const f={}; DB.students.forEach(s=>(s[field]||[]).forEach(t=>{ const k=t.trim().toLowerCase(); f[k]=(f[k]||0)+1; })); return Object.entries(f).sort((a,b)=>b[1]-a[1]); }
function readinessBuckets(){ const b=[0,0,0,0,0]; DB.students.forEach(s=>{ const p=progress(s); b[Math.min(4,Math.floor(p/20))]++; }); return b; }

/* ---- engagement & coverage ---- */
function paintCoverage(){
  const S=DB.students, now=new Date(), mk=monthKey(now.toISOString());
  const metThisMonth=S.filter(s=>s.sessions.some(ss=>monthKey(ss.date)===mk)).length;
  const overdue=S.filter(s=>s.sessions.length && daysSince(lastSession(s))>45).length;
  const never=S.filter(s=>!s.sessions.length).length;
  const cm=$('#covMet'); if(cm) cm.textContent=metThisMonth;
  const cmo=$('#covMonth'); if(cmo) cmo.textContent=monthLabel(mk).split(' ')[0];
  const co=$('#covOverdue'); if(co) co.textContent=overdue;
  const cn=$('#covNever'); if(cn) cn.textContent=never;
  // coverage ring
  const ring=$('#covRing'); if(ring){ const pct=Math.round(metThisMonth/S.length*100);
    ring.innerHTML=donutRing(pct, metThisMonth+'/'+S.length); }
  const rl=$('#covRingLabel'); if(rl) rl.textContent=metThisMonth+' of '+S.length+' cadets met in '+monthLabel(mk);
  // coverage-over-time bar chart (sessions per week, last 12 weeks)
  drawCoverChart();
  // longest unseen list
  const un=$('#unseenList'); if(un){
    const ranked=S.slice().map(s=>({s,d:s.sessions.length?daysSince(lastSession(s)):Infinity}))
      .sort((a,b)=>b.d-a.d).slice(0,8);
    un.innerHTML=ranked.map(({s,d})=>{
      const label=d===Infinity?'never met':d+' day'+(d!==1?'s':'')+' ago';
      const col=d===Infinity?'var(--descent)':d>45?'var(--amber)':'var(--dim)';
      return `<div class="waypoint" data-openu="${esc(s.id)}" style="cursor:pointer">
        <div class="badge ${statusOf(s)}" style="width:32px;height:32px;font-size:11px">${esc(initials(s.name))}</div>
        <div class="wpBody"><div class="wpText">${esc(tc(s.name))}</div>
        <div class="wpMeta"><span style="color:${col}">${label}</span></div></div></div>`;
    }).join('');
    $$('#unseenList [data-openu]').forEach(el=>el.onclick=()=>openStudent(el.dataset.openu));
  }
}
function donutRing(pct,label){
  const r=32, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 78 78" width="78" height="78">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--horizon)" stroke-width="7"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--climb)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 39 39)" style="transition:stroke-dashoffset .6s"/>
    <text x="39" y="37" text-anchor="middle" fill="var(--ink)" font-family="monospace" font-weight="700" font-size="15">${pct}%</text>
    <text x="39" y="50" text-anchor="middle" fill="var(--faint)" font-family="monospace" font-size="8">${esc(label)}</text></svg>`;
}
function drawCoverChart(){
  const cv=$('#coverChart'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,180);
  // last 12 weeks buckets
  const weeks=12, now=Date.now(), buckets=new Array(weeks).fill(0);
  DB.students.forEach(s=>s.sessions.forEach(ss=>{ const wAgo=Math.floor((now-new Date(ss.date))/(7*864e5)); if(wAgo>=0&&wAgo<weeks) buckets[weeks-1-wAgo]++; }));
  const TC=themeColors(); const max=Math.max(1,...buckets), pad=26, bw=(W-pad*2)/weeks;
  // baseline
  ctx.strokeStyle=TC.grid; ctx.beginPath(); ctx.moveTo(pad,H-24); ctx.lineTo(W-pad,H-24); ctx.stroke();
  buckets.forEach((n,i)=>{ const h=(n/max)*(H-46); const x=pad+i*bw, y=H-24-h;
    ctx.fillStyle=n?TC.climb:TC.grid; ctx.globalAlpha=n?.85:1; roundRect(ctx,x+2,y,bw-5,h||2,4); ctx.fill(); ctx.globalAlpha=1;
    if(n){ ctx.fillStyle=TC.ink; ctx.font='700 10px monospace'; ctx.textAlign='center'; ctx.fillText(n,x+bw/2,y-5); }
  });
  ctx.fillStyle=TC.faint; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('12 wks ago',pad,H-8);
  ctx.textAlign='right'; ctx.fillText('this week',W-pad,H-8);
}

/* ---- skills across batch ---- */
function skillAggregates(){
  const agg={}; /* skill -> {sum, count} of rated (level>0) */
  DB.students.forEach(s=>(s.ratedSkills||[]).forEach(r=>{ if(r.level>0){ agg[r.skill]=agg[r.skill]||{sum:0,count:0}; agg[r.skill].sum+=r.level; agg[r.skill].count++; } }));
  return Object.entries(agg).map(([skill,v])=>({skill,avg:v.sum/v.count,count:v.count})).sort((a,b)=>b.avg-a.avg);
}
function paintSkillHeat(){
  const el=$('#skillHeat'); if(!el) return;
  const A=skillAggregates();
  if(!A.length){ el.innerHTML='<div class="empty" style="padding:20px"><div class="e1">No skills rated yet</div>Rate cadets\u2019 skills on their profiles to see batch-wide proficiency.</div>'; return; }

/* ---- momentum & outcomes ---- */
function drawTrend(){
  const cv=$('#trendChart'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,190);
  // build monthly avg readiness from history snapshots across all students
  const byMonth={};
  DB.students.forEach(s=>(s.history||[]).forEach(h=>{ const k=monthKey(h.ts); byMonth[k]=byMonth[k]||[]; byMonth[k].push(h.readiness); }));
  const keys=Object.keys(byMonth).sort();
  const TC=themeColors();
  const note=$('#trendNote');
  if(keys.length<2){
    ctx.fillStyle=TC.faint; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText('Trend builds as you log sessions over time', W/2, H/2);
    if(note) note.textContent='Log sessions across weeks and months to see the batch\u2019s readiness climb.';
    return;
  }
  const pts=keys.map(k=>({k,v:byMonth[k].reduce((a,b)=>a+b,0)/byMonth[k].length}));
  const pad=34, max=100, min=0;
  // grid
  ctx.strokeStyle=TC.grid; ctx.lineWidth=1;
  [0,25,50,75,100].forEach(g=>{ const y=H-24-(g/100)*(H-46); ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-10,y); ctx.stroke();
    ctx.fillStyle=TC.faint; ctx.font='8px monospace'; ctx.textAlign='right'; ctx.fillText(g,pad-4,y+3); });
  // line
  const x=i=>pad+(i/(pts.length-1))*(W-pad-10), y=v=>H-24-(v/100)*(H-46);
  ctx.strokeStyle=TC.cyan; ctx.lineWidth=2.5; ctx.beginPath();
  pts.forEach((p,i)=>{ i?ctx.lineTo(x(i),y(p.v)):ctx.moveTo(x(i),y(p.v)); }); ctx.stroke();
  // fill under
  ctx.lineTo(x(pts.length-1),H-24); ctx.lineTo(x(0),H-24); ctx.closePath();
  ctx.fillStyle=TC.cyan; ctx.globalAlpha=.12; ctx.fill(); ctx.globalAlpha=1;
  // dots
  pts.forEach((p,i)=>{ ctx.fillStyle=TC.cyan; ctx.beginPath(); ctx.arc(x(i),y(p.v),3.5,0,7); ctx.fill();
    ctx.fillStyle=TC.ink; ctx.font='700 9px monospace'; ctx.textAlign='center'; ctx.fillText(Math.round(p.v),x(i),y(p.v)-8); });
  // month labels (first & last)
  ctx.fillStyle=TC.faint; ctx.font='8px monospace';
  ctx.textAlign='left'; ctx.fillText(monthLabel(pts[0].k).split(' ')[0], pad, H-8);
  ctx.textAlign='right'; ctx.fillText(monthLabel(pts[pts.length-1].k).split(' ')[0], W-10, H-8);
  if(note){ const delta=Math.round(pts[pts.length-1].v-pts[0].v);
    note.textContent=(delta>=0?'▲ Up ':'▼ Down ')+Math.abs(delta)+' points across '+pts.length+' months of tracking.'; note.style.color=delta>=0?'var(--climb)':'var(--descent)'; }
}

/* donut chart — goal distribution, interactive */
const CHART_COLORS=['#38e8d0','#ffb84d','#a78bfa','#4ade80','#ff6b7a','#5eb3ff','#f77fbe','#9de24d','#ff9d5c','#5ce0c8','#c792ea','#ffd166','#06d6a0','#ef476f','#7aa5ff','#b8b8ff'];
function drawDonut(){
  const cv=$('#donut'); if(!cv) return;
  const {ctx}=setupCanvas(cv,200,200);
  const dist=goalDistribution(); const total=dist.reduce((a,[,n])=>a+n,0);
  const cx=100,cy=100,rO=88,rI=54;
  if(!total){ ctx.fillStyle=cssVar('--faint'); ctx.font='11px monospace'; ctx.textAlign='center'; ctx.fillText('no goals set',100,104); return; }
  let a0=-Math.PI/2;
  const segs=[];
  dist.forEach(([g,n],i)=>{ const frac=n/total; const a1=a0+frac*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rO,a0,a1); ctx.closePath();
    ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length]; ctx.fill();
    segs.push({g,n,a0,a1,color:CHART_COLORS[i%CHART_COLORS.length]}); a0=a1; });
  // punch hole
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(cx,cy,rI,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  // center label
  ctx.fillStyle=cssVar('--ink'); ctx.font='700 26px monospace'; ctx.textAlign='center'; ctx.fillText(total,cx,cy-2);
  ctx.fillStyle=cssVar('--dim'); ctx.font='9px monospace'; ctx.fillText('WITH GOAL',cx,cy+14);
  // legend
  const leg=$('#donutLegend');
  leg.innerHTML=dist.map(([g,n],i)=>`<div class="legRow" data-goal="${esc(g)}" style="display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px">
    <span style="width:10px;height:10px;border-radius:3px;flex:none;background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>
    <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(shortGoal(g))}</span>
    <span class="mono" style="color:var(--dim)">${n}</span></div>`).join('');
  $$('#donutLegend .legRow').forEach(el=>{
    el.onmouseenter=()=>el.style.background='var(--surface2)'; el.onmouseleave=()=>el.style.background='';
    el.onclick=()=>{ VIEW='roster'; CURRENT=null; render(); setTimeout(()=>{ const f=$('#rSearch'); if(f){ f.value=shortGoal(el.dataset.goal); paintFleet(); } },50); };
  });
  // hover on donut
  cv.onmousemove=(e)=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left-cx, y=e.clientY-r.top-cy;
    const dist2=Math.sqrt(x*x+y*y); if(dist2<rI||dist2>rO){ cv.title=''; return; }
    let ang=Math.atan2(y,x); if(ang<-Math.PI/2) ang+=Math.PI*2;
    const seg=segs.find(sg=>ang>=sg.a0&&ang<sg.a1); cv.title=seg?`${shortGoal(seg.g)}: ${seg.n}`:''; };
}

/* histogram — readiness bands */
function drawHisto(){
  const cv=$('#histo'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,210);
  const TC=themeColors();
  const buckets=readinessBuckets(); const max=Math.max(1,...buckets);
  const labels=['0–20','20–40','40–60','60–80','80–100'];
  const colors=['#ff6b7a','#ff9d5c','#ffb84d','#9de24d','#4ade80'];
  const pad=30, bw=(W-pad*2)/5, gap=14;
  buckets.forEach((n,i)=>{
    const h=(n/max)*(H-50); const x=pad+i*bw, y=H-30-h;
    ctx.fillStyle=colors[i]; ctx.globalAlpha=.85;
    roundRect(ctx,x+gap/2,y,bw-gap,h,6); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=TC.ink; ctx.font='700 13px monospace'; ctx.textAlign='center'; if(n) ctx.fillText(n,x+bw/2,y-8);
    ctx.fillStyle=TC.dim; ctx.font='9px monospace'; ctx.fillText(labels[i],x+bw/2,H-12);
  });
}
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); if(h<=0){return;} ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* tiny sparkline of readiness history */
function sparkline(s){
  const h=(s.history||[]).map(x=>x.readiness); if(h.length<2) return '<div style="width:70px"></div>';
  const max=Math.max(...h,1), min=Math.min(...h,0), rng=Math.max(1,max-min);
  const pts=h.map((v,i)=>`${(i/(h.length-1))*66+2},${22-((v-min)/rng)*18-2}`).join(' ');
  const up=h[h.length-1]>=h[0];
  return `<svg width="70" height="24" style="flex:none"><polyline points="${pts}" fill="none" stroke="${up?'var(--climb)':'var(--descent)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

];
function roadmapData(){ if(!DB.roadmap){ DB.roadmap=JSON.parse(JSON.stringify(DEFAULT_MILESTONES)); store.save(); } return DB.roadmap; }

/* auto-progress: compute how far along each auto milestone is */
function milestoneProgress(m){
  const S=DB.students, n=S.length;
  const done=(f)=>S.filter(f).length;
  switch(m.auto){
    case 'metAll': return {have:done(s=>s.sessions.length),need:n};
    case 'goalAll': return {have:done(s=>s.goal),need:n};
    case 'sgAll': return {have:done(s=>s.strengths.length&&s.weaknesses.length),need:n};
    case 'poaAll': return {have:done(s=>s.poa.length),need:n};
    case 'skillAll': { const tgt=S.filter(s=>s.goal); return {have:tgt.filter(s=>(s.ratedSkills||[]).length).length,need:tgt.length||n}; }
    case 'met2': return {have:done(s=>s.sessions.length>=2),need:n};
    default: return null;
  }
}
function roadmapView(){
  const M=roadmapData();
  const S=DB.students;
  const autoDone=M.filter(m=>{ const p=milestoneProgress(m); return p&&p.have>=p.need&&p.need>0; }).length;
  const manualDone=M.filter(m=>!m.auto&&m.done).length;
  const total=M.length, complete=autoDone+manualDone;
  return `
    <div class="head"><div>
      <div class="kicker">Semester plan${cohortText()?(' · '+esc(cohortText())):''}</div>
      <h1 class="title">Roadmap</h1>
      <div class="lede">What should happen by when. Milestones tied to your data tick themselves off as you work through the batch; the rest you mark manually. A clear path from day one to the end-of-semester report.</div>
    </div>
    <div style="text-align:right"><div class="gNum" style="font-size:30px">${complete}<span style="font-size:16px;color:var(--faint)">/${total}</span></div><div class="gLab">milestones met</div></div></div>

    <div class="panel">
      <div class="roadTrack"><div class="roadFill" style="width:${Math.round(complete/total*100)}%"></div></div>
      <div class="timeline" style="margin-top:22px">
        ${M.map(m=>{
          const p=m.auto?milestoneProgress(m):null;
          const isDone=p? (p.have>=p.need&&p.need>0) : m.done;
          const pct=p&&p.need? Math.round(p.have/p.need*100):0;
          return `<div class="tlItem roadItem">
            <div class="roadDot ${isDone?'done':''}" ${m.auto?'':`data-mtoggle="${m.id}"`} style="${m.auto?'':'cursor:pointer'}">${isDone?'✓':''}</div>
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
                <div class="tlNotes" style="font-weight:600${isDone?';color:var(--dim);text-decoration:line-through':''}">${esc(m.title)}</div>
                <div class="mono" style="font-size:9px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase;white-space:nowrap">${esc(m.by)}</div>
              </div>
              ${m.auto? `<div style="margin-top:7px"><div class="traj" style="margin:0;height:6px"><div class="trajFill${isDone?'':' new'}" style="width:${pct}%"></div></div>
                <div class="mono" style="font-size:9px;color:var(--faint);margin-top:4px">${p.have}/${p.need} cadets · auto-tracked</div></div>`
                : `<div class="mono" style="font-size:9px;color:var(--faint);margin-top:5px">${isDone?'marked complete':'tap the circle when done'}</div>`}
            </div></div>`;
        }).join('')}
      </div>
    </div>

}

function ensureStudent(s){
  s.strengths=s.strengths||[]; s.weaknesses=s.weaknesses||[]; s.skills=s.skills||[];
  s.sessions=s.sessions||[]; s.poa=s.poa||[]; s.expertise=s.expertise||''; s.goal=s.goal||'';
  s.standing=s.standing||''; s.history=s.history||[]; s.ratedSkills=s.ratedSkills||[];
  s.internships=s.internships||[]; s.achievements=s.achievements||[];
  return s;
}
function normReg(x){ return String(x==null?'':x).toLowerCase().replace(/\s+/g,''); }
function matchRole(raw){
  if(!raw) return '';
  var low=String(raw).toLowerCase().trim();
  for(var i=0;i<ROLES.length;i++){ if(ROLES[i].toLowerCase()===low) return ROLES[i]; }
  for(var j=0;j<ROLES.length;j++){ var rl=ROLES[j].toLowerCase(); if(rl.indexOf(low)>=0 || low.indexOf(rl.split(' ')[0])>=0) return ROLES[j]; }
  return raw;
}
function parseCSV(text){
  text=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows=[], row=[], cur='', inq=false;
  for(var i=0;i<text.length;i++){ var ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=ch; }
    else { if(ch==='"') inq=true; else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return (c||'').trim()!==''; }); });
}
function autoMap(headers){
  var used={};
  function find(res){ for(var i=0;i<headers.length;i++){ if(used[i]) continue; var h=(headers[i]||'').toLowerCase().trim();
    for(var j=0;j<res.length;j++){ if(res[j].test(h)){ return i; } } } return -1; }
  var m={};
  m.parent=find([/parent/,/guardian/,/father/,/mother/,/emergency/]); if(m.parent>=0) used[m.parent]=1;
  m.email=find([/e-?mail/]); if(m.email>=0) used[m.email]=1;
  m.name=find([/student.*name/,/full.*name/,/^name$/,/\bname\b/]); if(m.name>=0) used[m.name]=1;
  m.reg=find([/reg.*no/,/registration/,/\breg\b/,/admission/,/enroll/,/univ.*no/]); if(m.reg>=0) used[m.reg]=1;
  m.sno=find([/roll/,/s\.?\s?no/,/serial/,/sl\.?no/,/^no$/,/^#$/]); if(m.sno>=0) used[m.sno]=1;
  m.phone=find([/student.*(phone|mobile)/,/^(phone|mobile|contact|cell)/,/phone/,/mobile/,/contact/,/cell/]); if(m.phone>=0) used[m.phone]=1;
  m.goal=find([/career.*goal/,/\bgoal\b/,/aspiration/,/ambition/,/career/]); if(m.goal>=0) used[m.goal]=1;
  m.section=find([/section/,/\bclass\b/,/batch/,/cohort/,/group/,/division/]);
  return m;
}
function doCsvImport(rows, map, cohortVal){
  var body=rows.slice(1);
  var byReg={}; DB.students.forEach(function(s){ byReg[normReg(s.reg)]=s; });
  var maxSno=DB.students.reduce(function(mx,s){ return Math.max(mx, s.sno||0); }, 0);
  var added=0, updated=0, stamp=Date.now();
  body.forEach(function(r){
    function cell(idx){ return (idx>=0 && idx<r.length) ? (r[idx]||'').trim() : ''; }
    var name=cell(map.name), reg=cell(map.reg);
    if(!name && !reg) return;
    var email=cell(map.email), phone=cell(map.phone), parent=cell(map.parent), goal=matchRole(cell(map.goal));
    var ex = reg ? byReg[normReg(reg)] : null;
    if(!ex && !reg && name){ ex = DB.students.filter(function(s){ return s.name && s.name.toLowerCase().trim()===name.toLowerCase().trim(); })[0]; }
    if(ex){
      if(name) ex.name=name; if(phone) ex.phone=phone; if(parent) ex.parent=parent;
      if(email) ex.email=email; if(goal && !ex.goal) ex.goal=goal;
      ex.updated=new Date().toISOString(); updated++;
    } else {
      var snoCsv=parseInt(cell(map.sno),10);
      var sno=(!isNaN(snoCsv)&&snoCsv>0)?snoCsv:(++maxSno);
      var id = reg || ('c'+stamp.toString(36)+'-'+added);
      var st = ensureStudent({ id:id, sno:sno, name:name||('Cadet '+sno), reg:reg||id,
        phone:phone, parent:parent, email:email, goal:goal||'', expertise:'', standing:'', created:new Date().toISOString() });
      DB.students.push(st); if(reg) byReg[normReg(reg)]=st; added++;
    }
  });
  if(cohortVal!=null){ DB.meta=DB.meta||{}; DB.meta.cohort=cohortVal; }
  store.save(); applyCohortLabels(); CURRENT=null; VIEW='roster'; render();
  toast('CSV imported · '+added+' new, '+updated+' updated');
}
function openCsvMap(rows){

    ['phone','Student phone'],['parent','Parent / guardian phone'],['email','Email'],['goal','Career goal']];

    fields.map(function(fl){ var sel=(m[fl[0]]!=null?m[fl[0]]:-1);
      return '<label class="fl">'+fl[1]+'</label><select class="field full" data-map="'+fl[0]+'" style="margin-bottom:10px">'+opts(sel)+'</select>'; }).join('')+
    '<label class="fl">Cohort name (shown on the console)</label>'+

    if(map.name<0 && map.reg<0){ toast('Pick at least a Name or Reg column'); return; }

/* ═══ rich intake import — Google-Forms style profile CSV (auto-detected) ═══ */
function isRichIntake(headers){
  var set=headers.map(function(h){return (h||'').trim().toLowerCase();});
  return set.indexOf('primary career goal')>=0 && set.some(function(h){return /rate yourself/.test(h);});
}
function richCohortDefault(rows){
  var headers=rows[0], hm={}; headers.forEach(function(h,i){ hm[(h||'').trim().toLowerCase()]=i; });
  function col(n){ var k=n.toLowerCase(); return hm.hasOwnProperty(k)?hm[k]:-1; }
  var r1=rows[1]||[], pi=col('institution & programme'), si=col('section'), yi=col('year of study');
  var prog=pi>=0?(r1[pi]||'').trim():'', sec=si>=0?(r1[si]||'').trim():'';
  var course = prog.indexOf('—')>=0 ? prog.split('—').pop().trim() : prog;
  course = course || prog;
  var c = (course||'') + (sec? ' · Sec '+sec : '');
  return c.trim() || cohortText();
}
function doRichImport(rows, cohortVal){

  function gi(n){ var k=n.trim().toLowerCase(); return hm.hasOwnProperty(k)?hm[k]:-1; }
  function gv(row,n){ var i=gi(n); return (i>=0 && i<row.length)?(row[i]||'').trim():''; }
  function splitTags(v){ return String(v||'').split(/[,\n;]+/).map(function(x){return x.trim();}).filter(Boolean); }
  function yes(v){ return /^(y|yes|true|1|done)/i.test(String(v||'').trim()); }
  var RMAP={'communication skills':'Communication','english speaking':'English','leadership':'Leadership','teamwork':'Teamwork','problem solving':'Problem Solving','computer skills':'Computer','public speaking':'Public Speaking','confidence':'Confidence','time management':'Time Management','discipline':'Discipline'};
  var HMAP={'resume prepared':'resume','linkedin profile':'linkedin','passport':'passport','driving license':'license','pan card':'pan','aadhaar card':'aadhaar'};
  var ratingCols=[], haveCols=[];
  headers.forEach(function(h,i){ var t=(h||'').toLowerCase(); var mb=(h||'').match(/\[(.+?)\]/);
    if(/rate yourself/.test(t)&&mb) ratingCols.push([i,mb[1].trim()]);
    if(/do you already have/.test(t)&&mb) haveCols.push([i,mb[1].trim()]); });
  var byReg={}; DB.students.forEach(function(s){ byReg[normReg(s.reg)]=s; });
  var maxSno=DB.students.reduce(function(mx,s){return Math.max(mx,s.sno||0);},0);
  var added=0, updated=0, stamp=Date.now();
  rows.slice(1).forEach(function(row){

    var ratings={}; ratingCols.forEach(function(rc){ var key=RMAP[rc[1].toLowerCase()]; var val=parseInt((row[rc[0]]||'').trim(),10); if(key&&!isNaN(val)) ratings[key]=val; });
    var have={}; haveCols.forEach(function(hc){ var key=HMAP[hc[1].toLowerCase()]; if(key) have[key]=yes(row[hc[0]]); });
    var intake={ gender:gv(row,'Gender'), dob:gv(row,'Date of Birth'), blood:gv(row,'Blood Group'),
      email:gv(row,'Student Email'), emgNum:gv(row,'Emergency Contact Number'), emgWho:gv(row,'Emergency Contact Person & Relationship'),
      father:gv(row,"Father's Name"), fatherOcc:gv(row,"Father's Occupation"), fatherMob:gv(row,"Father's Mobile"),
      mother:gv(row,"Mother's Name"), motherOcc:gv(row,"Mother's Occupation"), income:gv(row,'Annual Family Income'),
      sslc:gv(row,'SSLC — Percentage / CGPA'), hsc:gv(row,'HSC — Percentage / CGPA'),
      why:gv(row,'Why did you choose Aviation?'), inspired:gv(row,'What or who inspired you?'),
      certs:gv(row,'If Yes, list your certifications'), primaryGoal:gv(row,'Primary Career Goal'),
      considering:splitTags(gv(row,'Other Careers You Are Also Considering')), dream:gv(row,'Dream Company / Organisation'),
      afterGrad:gv(row,'Career Goal after Graduation'), fiveYr:gv(row,'Five-Year Career Plan'),
      languages:gv(row,'Languages Known'), software:gv(row,'Software Skills'), sports:gv(row,'Sports'),
      hobbies:gv(row,'Hobbies'), clubs:gv(row,'Club Interests'), medical:gv(row,'Medical Conditions'),
      allergies:gv(row,'Allergies'), medication:gv(row,'Regular Medication'), fitness:gv(row,'Physical Fitness Issues'),
      challenge:gv(row,'Your Biggest Challenge'), help:gv(row,'How can your mentor help you?'),
      learning:gv(row,'Preferred Learning Style'), comm:gv(row,'Preferred Communication with Mentor'),
      dgca:gv(row,'DGCA Papers Cleared'), have:have };
    var strengths=splitTags(gv(row,'Your Strengths'));
    var weaknesses=splitTags(gv(row,'Areas for Improvement'));
    var goal=matchRole(gv(row,'Primary Career Goal'));
    var internOrg=gv(row,'Internship Organisation'), internDone=yes(gv(row,'Internship Completed'));
    var achievements=[]; splitTags(gv(row,'Certifications Completed')).forEach(function(c){ if(c && !/^none$/i.test(c)) achievements.push({title:c,category:'Certification',date:'',note:'From intake form'}); });
    var ratedSkills=Object.keys(ratings).map(function(k){return {skill:k,level:ratings[k]||0,note:''};});
    var phone=gv(row,'Student Mobile Number'), parent=gv(row,"Father's Mobile")||gv(row,'Emergency Contact Number'), email=gv(row,'Student Email');
    var interns=(internDone&&internOrg)?[{org:internOrg,role:'',days:'',status:'done',start:'',note:'From intake form'}]:[];
    var ex = reg ? byReg[normReg(reg)] : null;
    if(!ex && !reg && name){ ex=DB.students.filter(function(s){return s.name&&s.name.toLowerCase().trim()===name.toLowerCase().trim();})[0]; }
    if(ex){
      if(name) ex.name=name; if(phone) ex.phone=phone; if(parent) ex.parent=parent; if(email) ex.email=email;
      if(goal && !ex.goal) ex.goal=goal;
      if((!ex.strengths||!ex.strengths.length)&&strengths.length) ex.strengths=strengths;
      if((!ex.weaknesses||!ex.weaknesses.length)&&weaknesses.length) ex.weaknesses=weaknesses;
      if((!ex.ratedSkills||!ex.ratedSkills.length)&&ratedSkills.length) ex.ratedSkills=ratedSkills;
      if((!ex.internships||!ex.internships.length)&&interns.length) ex.internships=interns;

        goal:goal||'',expertise:'',standing:'',strengths:strengths,weaknesses:weaknesses,ratedSkills:ratedSkills,

      DB.students.push(st); if(reg) byReg[normReg(reg)]=st; added++;
    }
  });
  if(cohortVal!=null){ DB.meta=DB.meta||{}; DB.meta.cohort=cohortVal; }
  store.save(); applyCohortLabels(); CURRENT=null; VIEW='roster'; render();

  }

  if(!window.STORAGE_OK){ setTimeout(showBanner, 600); }

  function show(title,msg){
    var b=document.getElementById('__errbar');
    if(b&&b.parentNode)b.parentNode.removeChild(b);
    b=document.createElement('div');b.id='__errbar';
    b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#d03b3b;color:#fff;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px 16px;max-height:70vh;overflow:auto;white-space:pre-wrap;box-shadow:0 4px 20px rgba(0,0,0,.4)';
    b.textContent='\u26A0 '+title+'\n\n'+msg+'\n\nBrowser: '+navigator.userAgent+'\n\n(tap to dismiss)';
    b.onclick=function(){b.parentNode&&b.parentNode.removeChild(b);};
    (document.body||document.documentElement).appendChild(b);
  }
  window.__show=show;
  function attempt(){
    var st=document.getElementById('stage');
    if(!st) return;
    if(st.innerHTML.trim()!=='') return; /* app already drew — nothing to do */
    var captured=(window.__errs&&window.__errs.length)?window.__errs.join('\n'):'';
    /* try to draw the dashboard ourselves */
    if(typeof render==='function'){
      try{
        render();
        /* re-bind the sidebar so navigation works even if the main script's tail failed */
        var items=document.querySelectorAll('.navItem');
        for(var i=0;i<items.length;i++){(function(n){
          n.onclick=function(){ try{ VIEW=n.dataset.view; CURRENT=null; render(); }
            catch(e){ show('A view failed to open',(e&&e.message||e)+'\n'+(e&&e.stack||'')); } };
        })(items[i]);}
        if(captured) console.warn('MENTOR recovered after error:',captured);
      }catch(e){
        show('MENTOR could not start',(e&&e.message||e)+'\n'+(e&&e.stack||'')+(captured?('\n\nEarlier:\n'+captured):''));
      }
    } else {
      show('MENTOR could not start','render() was never defined — the main script failed to load.'+(captured?('\n\nError:\n'+captured):''));
    }
  }
  /* run now, and once more shortly after in case something is still settling */
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',attempt); else attempt();
  setTimeout(attempt,300);
})();
</script>
</body>
</html>
