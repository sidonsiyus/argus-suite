<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENTOR · Aviation Mentee Console</title>
<style>
:root{
  --void:#0b0f14; --surface:#121a23; --surface2:#17222e; --raised:#1b2836;
  --horizon:#1e2c3a; --horizon2:#2a3d4f;
  --ink:#dde8f0; --dim:#7d94a6; --faint:#546878;
  --cyan:#38e8d0; --cyan-deep:#1a9d8e; --amber:#ffb84d; --amber-deep:#b8801f;
  --climb:#4ade80; --descent:#ff6b7a; --violet:#a78bfa;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
}
[data-theme="light"]{
  --void:#eef3f7; --surface:#ffffff; --surface2:#f4f8fb; --raised:#ffffff;
  --horizon:#dbe5ec; --horizon2:#c3d2dd;
  --ink:#12222e; --dim:#5a7285; --faint:#8ba0b0;
  --cyan:#0ea89a; --cyan-deep:#0b7d72; --amber:#d98815; --amber-deep:#9c6410;
  --climb:#18a558; --descent:#e0455a; --violet:#7159d6;
}
*{box-sizing:border-box}
::selection{background:rgba(56,232,208,.25)}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 15% -5%,rgba(56,232,208,.06),transparent 55%),
    radial-gradient(ellipse 60% 40% at 95% 0%,rgba(255,184,77,.045),transparent 50%);
  background-attachment:fixed;}
[data-theme="light"] body,[data-theme="light"]{background-image:
    radial-gradient(ellipse 80% 50% at 15% -5%,rgba(14,168,154,.08),transparent 55%),
    radial-gradient(ellipse 60% 40% at 95% 0%,rgba(217,136,21,.06),transparent 50%);}
[data-theme="light"] .rail{background:linear-gradient(180deg,#ffffff,#eef3f7)}
[data-theme="light"] .badge,[data-theme="light"] .pBadge{color:#fff}
[data-theme="light"] .btn.go{color:#04312c} [data-theme="light"] .btn.amber{color:#3d2600}
[data-theme="light"] .heatInit{color:rgba(255,255,255,.95)}
[data-theme="light"] .markName{background:linear-gradient(100deg,#0b7d72,#0ea89a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.015em}
button{font-family:inherit}
a{color:inherit}

/* ── app shell ── */
.app{display:flex;min-height:100vh}
.rail{width:216px;flex:none;background:linear-gradient(180deg,var(--surface),var(--void));
  border-right:1px solid var(--horizon);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10}
.mark{padding:22px 20px 18px;border-bottom:1px solid var(--horizon)}
.markName{font-family:var(--mono);font-weight:700;letter-spacing:.3em;font-size:17px;
  background:linear-gradient(100deg,var(--cyan),#7ff0e2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.markSub{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--faint);margin-top:6px;text-transform:uppercase;line-height:1.5}
.nav{padding:14px 12px;flex:1}
.navLabel{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;padding:8px 12px 6px}
.navItem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--dim);
  font-size:13px;font-weight:560;transition:all .16s;margin-bottom:2px;position:relative}
.navItem:hover{background:var(--surface2);color:var(--ink)}
.navItem.on{background:linear-gradient(90deg,rgba(56,232,208,.13),rgba(56,232,208,.02));color:var(--cyan)}
.navItem.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.navIco{width:17px;text-align:center;font-size:14px}
.railFoot{padding:12px;border-top:1px solid var(--horizon);display:flex;flex-direction:column;gap:6px}
.ghost{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;text-align:left;
  background:none;border:1px solid var(--horizon);border-radius:9px;padding:9px 11px;color:var(--dim);cursor:pointer;transition:.16s}
.ghost:hover{border-color:var(--cyan-deep);color:var(--cyan)}

.stage{flex:1;min-width:0;padding:28px 34px 70px;max-width:1400px}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase;margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:14px;height:1px;background:var(--cyan);display:inline-block}
.title{font-size:29px;line-height:1.05}
.lede{color:var(--dim);font-size:13.5px;margin-top:7px;max-width:620px}

/* ── instrument tiles ── */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.gauge{border:1px solid var(--horizon);border-radius:16px;padding:17px 18px;background:var(--surface);position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s}
.gauge:hover{border-color:var(--horizon2);transform:translateY(-1px)}
.gauge::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accentc,var(--cyan));opacity:.55}
.gauge.c-amber{--accentc:var(--amber)} .gauge.c-red{--accentc:var(--descent)} .gauge.c-green{--accentc:var(--climb)} .gauge.c-violet{--accentc:var(--violet)}
.gNum{font-family:var(--mono);font-size:33px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gLab{font-family:var(--mono);font-size:9px;letter-spacing:.11em;color:var(--dim);text-transform:uppercase;margin-top:10px}
.gSub{font-size:11px;color:var(--faint);margin-top:3px}

/* ── panels ── */
.panel{border:1px solid var(--horizon);border-radius:16px;background:var(--surface);padding:20px;margin-bottom:18px}
.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.panelTitle{font-size:15px;font-weight:680;display:flex;align-items:center;gap:9px}
.panelTitle .dotc{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase}

/* ── toolbar / inputs ── */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.field{background:var(--surface2);border:1px solid var(--horizon);border-radius:10px;padding:10px 13px;color:var(--ink);font-size:13px;font-family:inherit;transition:border-color .16s}
.field:focus{outline:none;border-color:var(--cyan)}
.field::placeholder{color:var(--faint)}
select.field{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237d94a6' fill='none' stroke-width='1.4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
label.fl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
textarea.field{width:100%;resize:vertical;min-height:70px;line-height:1.55}

.btn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  border:1px solid var(--horizon);border-radius:10px;padding:11px 17px;background:var(--surface2);color:var(--ink);
  transition:all .16s;font-weight:600}
.btn:hover{border-color:var(--horizon2)}
.btn.go{background:linear-gradient(100deg,var(--cyan),#6ceada);color:#052420;border:none;box-shadow:0 6px 20px -8px var(--cyan)}
.btn.go:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.amber{background:linear-gradient(100deg,var(--amber),#ffce80);color:#3d2600;border:none}
.btn.sm{padding:7px 12px;font-size:9px}
.btn.danger:hover{border-color:var(--descent);color:var(--descent)}

/* ── student cards / grid ── */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.strip{border:1px solid var(--horizon);border-radius:14px;background:var(--surface);padding:15px;cursor:pointer;
  transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;overflow:hidden}
.strip:hover{transform:translateY(-2px);border-color:var(--cyan-deep);box-shadow:0 12px 30px -18px var(--cyan)}
.stripTop{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.badge{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:14px;color:var(--void);background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));
  box-shadow:0 4px 14px -6px var(--cyan)}
.badge.risk{background:linear-gradient(135deg,var(--descent),#c04352);box-shadow:0 4px 14px -6px var(--descent)}
.badge.new{background:linear-gradient(135deg,var(--amber),var(--amber-deep));box-shadow:0 4px 14px -6px var(--amber)}
.sName{font-size:13.5px;font-weight:650;line-height:1.2}
.sReg{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px;letter-spacing:.04em}
/* trajectory bar — the signature element */
.traj{height:5px;border-radius:3px;background:var(--horizon);position:relative;overflow:hidden;margin:12px 0 9px}
.trajFill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.trajFill.risk{background:linear-gradient(90deg,#8a3540,var(--descent))}
.trajFill.new{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
.trajMeta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-family:var(--mono);font-size:8px;letter-spacing:.05em;padding:3px 8px;border-radius:20px;border:1px solid var(--horizon);color:var(--dim);white-space:nowrap}
.chip.goal{color:var(--cyan);border-color:var(--cyan-deep)}
.chip.risk{color:var(--descent);border-color:rgba(255,107,122,.4);background:rgba(255,107,122,.08)}
.chip.ok{color:var(--climb);border-color:rgba(74,222,128,.35)}
.chip.new{color:var(--amber);border-color:rgba(255,184,77,.35)}

.empty{text-align:center;padding:44px;color:var(--faint);font-family:var(--mono);font-size:11px}
.empty .e1{font-size:14px;color:var(--dim);margin-bottom:7px;font-family:var(--sans)}

/* ── toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--raised);border:1px solid var(--horizon2);border-radius:11px;padding:12px 20px;font-size:13px;
  transition:.25s cubic-bezier(.2,.8,.2,1);z-index:300;pointer-events:none;box-shadow:0 16px 40px -16px #000}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ── profile view ── */
.profileTop{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.pBadge{width:72px;height:72px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:26px;color:var(--void);background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));
  box-shadow:0 8px 24px -8px var(--cyan)}
.pBadge.risk{background:linear-gradient(135deg,var(--descent),#c04352)} .pBadge.new{background:linear-gradient(135deg,var(--amber),var(--amber-deep))}
.pInfo{flex:1;min-width:220px}
.pName{font-size:24px;font-weight:750;letter-spacing:-.01em}
.pReg{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.04em}
.pContact{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
.pContact span{font-family:var(--mono);font-size:10px;color:var(--faint)}
.pContact b{color:var(--dim);font-weight:500}
.backBtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:7px}
.backBtn:hover{color:var(--cyan)}

/* big trajectory readout on profile */
.glidepath{border:1px solid var(--horizon);border-radius:16px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:20px;margin-bottom:18px}
.glideLabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.glideTrack{height:10px;border-radius:6px;background:var(--horizon);position:relative;overflow:hidden}
.glideFill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan));box-shadow:0 0 16px -2px var(--cyan);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.glideFill.risk{background:linear-gradient(90deg,#8a3540,var(--descent));box-shadow:0 0 16px -2px var(--descent)}
.glideFill.new{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
.glideStat{display:flex;justify-content:space-between;margin-top:12px;align-items:center;flex-wrap:wrap;gap:10px}
.glidePct{font-family:var(--mono);font-size:22px;font-weight:700}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* tags/lists inside profile */
.taglist{display:flex;flex-wrap:wrap;gap:7px}
.taglist .t{font-size:12px;padding:5px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--horizon);display:inline-flex;align-items:center;gap:7px}
.taglist .t.strength{border-color:rgba(74,222,128,.3);color:#a8f0c4}
.taglist .t.weak{border-color:rgba(255,184,77,.3);color:#ffd9a0}
.taglist .t.skill{border-color:rgba(167,139,250,.3);color:#d0c2fc}
.taglist .t x{cursor:pointer;color:var(--faint);font-size:13px;line-height:1}
.taglist .t x:hover{color:var(--descent)}
.addRow{display:flex;gap:8px;margin-top:12px}
.addRow .field{flex:1}

/* POA waypoints */
.waypoint{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--horizon)}
.waypoint:last-child{border-bottom:none}
.wpCheck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--horizon2);flex:none;cursor:pointer;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.16s;color:transparent;font-size:12px}
.wpCheck:hover{border-color:var(--cyan)}
.wpCheck.done{background:var(--cyan);border-color:var(--cyan);color:var(--void)}
.wpBody{flex:1;min-width:0}
.wpText{font-size:13px;line-height:1.5}
.wpText.done{color:var(--faint);text-decoration:line-through}
.wpMeta{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px;display:flex;gap:10px;align-items:center}
.wpMeta .overdue{color:var(--descent)}
.wpDel{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;flex:none}
.wpDel:hover{color:var(--descent)}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--horizon)}
.tlItem{position:relative;padding:0 0 20px 0}
.tlItem::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--cyan);box-shadow:0 0 0 3px var(--surface)}
.tlItem:last-child{padding-bottom:0}
.tlDate{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--cyan);text-transform:uppercase;margin-bottom:5px}
.tlNotes{font-size:13px;line-height:1.55;color:var(--ink)}
.tlSub{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.tlSub b{color:var(--dim);font-weight:600}

/* ── modal ── */
.scrim{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,8,11,.75);backdrop-filter:blur(7px)}
.scrim[hidden]{display:none!important}
.modal{position:relative;width:min(560px,95vw);max-height:86vh;overflow:auto;border:1px solid var(--horizon2);border-radius:20px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));padding:26px;box-shadow:0 40px 90px -30px #000;
  animation:mIn .4s cubic-bezier(.2,.9,.25,1.05)}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.mClose{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;line-height:1}
.mClose:hover{color:var(--ink)}
.field.full{width:100%;margin-bottom:12px}

@media(max-width:820px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .mark{border-bottom:none;border-right:1px solid var(--horizon)}
  .nav{display:flex;flex:1;padding:8px;overflow-x:auto;align-items:center}
  .navLabel{display:none} .navItem{white-space:nowrap;margin-bottom:0}
  .railFoot{flex-direction:row;border-top:none}
  .stage{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Stage 3 analytics */
  .heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  .heatCell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:1px solid rgba(255,255,255,.06);transition:transform .12s,box-shadow .12s;position:relative}
  .heatCell:hover{transform:scale(1.12);box-shadow:0 6px 18px -6px #000;z-index:2;border-color:var(--cyan)}
  .heatInit{font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .heatKey{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:9px;color:var(--faint)}
  .heatGrad{flex:1;height:7px;border-radius:4px;background:linear-gradient(90deg,hsl(0 65% 20%),hsl(65 65% 30%),hsl(130 65% 40%))}
  .trackRow{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--horizon);cursor:pointer;transition:padding-left .14s}
  .trackRow:last-child{border-bottom:none}
  .trackRow:hover{padding-left:6px}


  /* rated skills */
  .skillRow{border:1px solid var(--horizon);border-radius:11px;padding:12px 13px;margin-bottom:10px;background:var(--surface2)}
  .skillTop{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .skillName{flex:1;min-width:0;font-size:13px;font-weight:600}
  .skillLvl{display:flex;align-items:center;gap:5px}
  .lvlDot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--horizon2);cursor:pointer;transition:.14s;background:transparent}
  .lvlDot:hover{border-color:var(--cyan)}
  .lvlDot.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px -2px var(--cyan)}
  .lvlLabel{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.05em;margin-left:6px;min-width:64px}
  .skillNote{width:100%;font-size:12px;padding:8px 10px}
  .addSkillRow{display:flex;gap:8px;margin-top:12px}


  /* AI assist */
  .aiSpin{width:32px;height:32px;border-radius:50%;border:3px solid var(--horizon);border-top-color:var(--violet);animation:aiSpin .8s linear infinite;margin:0 auto}
  @keyframes aiSpin{to{transform:rotate(360deg)}}
  .aiPick{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--horizon);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface2)}
  .aiPick:hover{border-color:var(--violet)}
  .aiPick input{margin-top:3px;accent-color:var(--violet)}
  .aiPick span{font-size:13px;line-height:1.5}


  /* Stage 5 section dividers */
  .sectionRule{display:flex;align-items:center;gap:14px;margin:26px 0 16px}
  .sectionRule::before,.sectionRule::after{content:"";height:1px;background:var(--horizon);flex:1}
  .sectionRule span{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}


  /* Stage 6 · bulk + groups + roadmap + notes */
  .segmented{display:inline-flex;border:1px solid var(--horizon);border-radius:11px;overflow:hidden}
  .segBtn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;background:var(--surface);color:var(--dim);border:none;cursor:pointer;transition:.15s}
  .segBtn:hover{color:var(--ink)}

function setupCanvas(cv, cssW, cssH){
  /* HiDPI: size backing buffer to the element's real display size × dpr, scale context to CSS px */
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  const rect=cv.getBoundingClientRect();
  const w = rect.width || cssW, h = cssH || (cssW ? cssW*(cv.height/cv.width) : rect.height);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, W:w, H:h};
}
function themeColors(){ return { ink:cssVar('--ink'), dim:cssVar('--dim'), faint:cssVar('--faint'), grid:cssVar('--horizon'),

function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function daysSince(iso){ if(!iso) return Infinity; return Math.floor((Date.now()-new Date(iso))/864e5); }
function lastSession(s){ return s.sessions&&s.sessions.length? s.sessions[s.sessions.length-1].date : null; }

/* ── progress + risk model ── */
function progress(s){
  /* a simple, transparent 0-100 "readiness" score from what's been captured */
  let p=0;
  if(s.goal) p+=18;
  if(s.expertise) p+=8;
  if(s.strengths.length) p+=Math.min(12,s.strengths.length*4);
  const rs=s.ratedSkills||[]; if(rs.length){ const avgLvl=rs.reduce((a,r)=>a+(r.level||0),0)/rs.length; p+=Math.min(10,Math.round(avgLvl/5*10)); }
  if(s.sessions.length) p+=Math.min(20,s.sessions.length*7);
  const poaDone=s.poa.filter(x=>x.done).length, poaTot=s.poa.length;
  if(poaTot) p+=Math.round((poaDone/poaTot)*30);
  if(!s.weaknesses.length && s.sessions.length) p+=8; /* no open gaps */
  return Math.max(0,Math.min(100,p));
}
function riskReasons(s){
  const r=[];
  if(!s.goal) r.push('No career goal set');
  if(!s.sessions.length) r.push('No session logged yet');
  else if(daysSince(lastSession(s))>45) r.push('No session in 45+ days');
  const overdue=s.poa.filter(p=>!p.done && p.due && new Date(p.due)<new Date()).length;
  if(overdue) r.push(overdue+' overdue action'+(overdue>1?'s':''));
  if(s.weaknesses.length && !s.poa.length) r.push('Gaps noted, no plan yet');
  return r;
}
function statusOf(s){ if(!s.sessions.length) return 'new'; return riskReasons(s).length?'risk':'ok'; }

/* momentum: compare recent readiness snapshots to see if a cadet is improving, flat, or slipping */
function momentum(s){
  const h=s.history||[];
  if(h.length<2){
    /* not enough history — infer from recency of engagement */
    if(!s.sessions.length) return {dir:'none',label:'Not started',delta:0};
    return {dir:'new',label:'Baseline set',delta:0};
  }
  const recent=h[h.length-1].readiness, prev=h[Math.max(0,h.length-3)].readiness;
  const delta=recent-prev;
  if(delta>=6) return {dir:'up',label:'Improving',delta};
  if(delta<=-6) return {dir:'down',label:'Slipping',delta};
  return {dir:'flat',label:'Holding steady',delta};
}
function momentumColor(d){ return d==='up'?'var(--climb)':d==='down'?'var(--descent)':d==='flat'?'var(--amber)':'var(--faint)'; }
function momentumArrow(d){ return d==='up'?'▲':d==='down'?'▼':d==='flat'?'▬':'○'; }

/* month key helpers */
function monthKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }

/* aggregate helpers */
function goalDistribution(){ const d={}; DB.students.forEach(s=>{ if(s.goal) d[s.goal]=(d[s.goal]||0)+1; }); return Object.entries(d).sort((a,b)=>b[1]-a[1]); }
function tagFrequency(field){ const f={}; DB.students.forEach(s=>(s[field]||[]).forEach(t=>{ const k=t.trim().toLowerCase(); f[k]=(f[k]||0)+1; })); return Object.entries(f).sort((a,b)=>b[1]-a[1]); }
function readinessBuckets(){ const b=[0,0,0,0,0]; DB.students.forEach(s=>{ const p=progress(s); b[Math.min(4,Math.floor(p/20))]++; }); return b; }

/* ─────────── ANALYTICS VIEW ─────────── */
function analyticsView(){
  const S=DB.students;
  const avg=Math.round(S.reduce((a,s)=>a+progress(s),0)/S.length);
  const improving=S.filter(s=>momentum(s).dir==='up').length;
  const slipping=S.filter(s=>momentum(s).dir==='down').length;
  const totalSessions=S.reduce((a,s)=>a+s.sessions.length,0);
  const met=S.filter(s=>s.sessions.length).length;
  return `
    <div class="head"><div>
      <div class="kicker">Batch analytics · live</div>

/* ---- engagement & coverage ---- */
function paintCoverage(){
  const S=DB.students, now=new Date(), mk=monthKey(now.toISOString());
  const metThisMonth=S.filter(s=>s.sessions.some(ss=>monthKey(ss.date)===mk)).length;
  const overdue=S.filter(s=>s.sessions.length && daysSince(lastSession(s))>45).length;
  const never=S.filter(s=>!s.sessions.length).length;
  const cm=$('#covMet'); if(cm) cm.textContent=metThisMonth;
  const cmo=$('#covMonth'); if(cmo) cmo.textContent=monthLabel(mk).split(' ')[0];
  const co=$('#covOverdue'); if(co) co.textContent=overdue;
  const cn=$('#covNever'); if(cn) cn.textContent=never;
  // coverage ring
  const ring=$('#covRing'); if(ring){ const pct=Math.round(metThisMonth/S.length*100);
    ring.innerHTML=donutRing(pct, metThisMonth+'/'+S.length); }
  const rl=$('#covRingLabel'); if(rl) rl.textContent=metThisMonth+' of '+S.length+' cadets met in '+monthLabel(mk);
  // coverage-over-time bar chart (sessions per week, last 12 weeks)
  drawCoverChart();
  // longest unseen list
  const un=$('#unseenList'); if(un){
    const ranked=S.slice().map(s=>({s,d:s.sessions.length?daysSince(lastSession(s)):Infinity}))
      .sort((a,b)=>b.d-a.d).slice(0,8);
    un.innerHTML=ranked.map(({s,d})=>{
      const label=d===Infinity?'never met':d+' day'+(d!==1?'s':'')+' ago';
      const col=d===Infinity?'var(--descent)':d>45?'var(--amber)':'var(--dim)';
      return `<div class="waypoint" data-openu="${esc(s.id)}" style="cursor:pointer">
        <div class="badge ${statusOf(s)}" style="width:32px;height:32px;font-size:11px">${esc(initials(s.name))}</div>
        <div class="wpBody"><div class="wpText">${esc(tc(s.name))}</div>
        <div class="wpMeta"><span style="color:${col}">${label}</span></div></div></div>`;
    }).join('');
    $$('#unseenList [data-openu]').forEach(el=>el.onclick=()=>openStudent(el.dataset.openu));
  }
}
function donutRing(pct,label){
  const r=32, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 78 78" width="78" height="78">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--horizon)" stroke-width="7"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--climb)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 39 39)" style="transition:stroke-dashoffset .6s"/>
    <text x="39" y="37" text-anchor="middle" fill="var(--ink)" font-family="monospace" font-weight="700" font-size="15">${pct}%</text>
    <text x="39" y="50" text-anchor="middle" fill="var(--faint)" font-family="monospace" font-size="8">${esc(label)}</text></svg>`;
}
function drawCoverChart(){
  const cv=$('#coverChart'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,180);
  // last 12 weeks buckets
  const weeks=12, now=Date.now(), buckets=new Array(weeks).fill(0);
  DB.students.forEach(s=>s.sessions.forEach(ss=>{ const wAgo=Math.floor((now-new Date(ss.date))/(7*864e5)); if(wAgo>=0&&wAgo<weeks) buckets[weeks-1-wAgo]++; }));
  const TC=themeColors(); const max=Math.max(1,...buckets), pad=26, bw=(W-pad*2)/weeks;
  // baseline
  ctx.strokeStyle=TC.grid; ctx.beginPath(); ctx.moveTo(pad,H-24); ctx.lineTo(W-pad,H-24); ctx.stroke();
  buckets.forEach((n,i)=>{ const h=(n/max)*(H-46); const x=pad+i*bw, y=H-24-h;
    ctx.fillStyle=n?TC.climb:TC.grid; ctx.globalAlpha=n?.85:1; roundRect(ctx,x+2,y,bw-5,h||2,4); ctx.fill(); ctx.globalAlpha=1;
    if(n){ ctx.fillStyle=TC.ink; ctx.font='700 10px monospace'; ctx.textAlign='center'; ctx.fillText(n,x+bw/2,y-5); }
  });
  ctx.fillStyle=TC.faint; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('12 wks ago',pad,H-8);
  ctx.textAlign='right'; ctx.fillText('this week',W-pad,H-8);
}

/* ---- skills across batch ---- */
function skillAggregates(){
  const agg={}; /* skill -> {sum, count} of rated (level>0) */
  DB.students.forEach(s=>(s.ratedSkills||[]).forEach(r=>{ if(r.level>0){ agg[r.skill]=agg[r.skill]||{sum:0,count:0}; agg[r.skill].sum+=r.level; agg[r.skill].count++; } }));
  return Object.entries(agg).map(([skill,v])=>({skill,avg:v.sum/v.count,count:v.count})).sort((a,b)=>b.avg-a.avg);
}
function paintSkillHeat(){
  const el=$('#skillHeat'); if(!el) return;
  const A=skillAggregates();
  if(!A.length){ el.innerHTML='<div class="empty" style="padding:20px"><div class="e1">No skills rated yet</div>Rate cadets\u2019 skills on their profiles to see batch-wide proficiency.</div>'; return; }
  el.innerHTML=A.slice(0,10).map(({skill,avg,count})=>{
    const pct=Math.round(avg/5*100); const hue=Math.round(avg/5*130);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(skill)}</div>
      <div class="traj" style="width:120px;flex:none;margin:0;height:9px"><div class="trajFill" style="width:${pct}%;background:hsl(${hue} 65% 45%)"></div></div>
      <div class="mono" style="font-size:10px;color:var(--dim);width:52px;text-align:right">${avg.toFixed(1)}/5 · ${count}</div></div>`;
  }).join('');
}
function paintWeakSkills(){
  const el=$('#weakSkills'); if(!el) return;
  const A=skillAggregates().filter(x=>x.count>=1).sort((a,b)=>a.avg-b.avg);
  if(!A.length){ el.innerHTML='<div class="empty" style="padding:20px"><div class="e1">No skills rated yet</div>Once you rate skills, the weakest ones surface here as workshop targets.</div>'; return; }
  el.innerHTML=A.slice(0,7).map(({skill,avg,count})=>{
    const pct=Math.round(avg/5*100);
    return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
      <span>${esc(skill)}</span><span class="mono" style="color:var(--descent)">${avg.toFixed(1)}/5</span></div>
      <div class="traj" style="margin:0;height:7px"><div class="trajFill risk" style="width:${pct}%"></div></div>
      <div class="mono" style="font-size:9px;color:var(--faint);margin-top:3px">${count} cadet${count!==1?'s':''} rated</div></div>`;
  }).join('');
}

/* ---- momentum & outcomes ---- */
function drawTrend(){
  const cv=$('#trendChart'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,190);
  // build monthly avg readiness from history snapshots across all students
  const byMonth={};
  DB.students.forEach(s=>(s.history||[]).forEach(h=>{ const k=monthKey(h.ts); byMonth[k]=byMonth[k]||[]; byMonth[k].push(h.readiness); }));
  const keys=Object.keys(byMonth).sort();
  const TC=themeColors();
  const note=$('#trendNote');
  if(keys.length<2){
    ctx.fillStyle=TC.faint; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText('Trend builds as you log sessions over time', W/2, H/2);
    if(note) note.textContent='Log sessions across weeks and months to see the batch\u2019s readiness climb.';
    return;
  }
  const pts=keys.map(k=>({k,v:byMonth[k].reduce((a,b)=>a+b,0)/byMonth[k].length}));
  const pad=34, max=100, min=0;
  // grid
  ctx.strokeStyle=TC.grid; ctx.lineWidth=1;
  [0,25,50,75,100].forEach(g=>{ const y=H-24-(g/100)*(H-46); ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-10,y); ctx.stroke();
    ctx.fillStyle=TC.faint; ctx.font='8px monospace'; ctx.textAlign='right'; ctx.fillText(g,pad-4,y+3); });
  // line
  const x=i=>pad+(i/(pts.length-1))*(W-pad-10), y=v=>H-24-(v/100)*(H-46);
  ctx.strokeStyle=TC.cyan; ctx.lineWidth=2.5; ctx.beginPath();
  pts.forEach((p,i)=>{ i?ctx.lineTo(x(i),y(p.v)):ctx.moveTo(x(i),y(p.v)); }); ctx.stroke();
  // fill under
  ctx.lineTo(x(pts.length-1),H-24); ctx.lineTo(x(0),H-24); ctx.closePath();
  ctx.fillStyle=TC.cyan; ctx.globalAlpha=.12; ctx.fill(); ctx.globalAlpha=1;
  // dots
  pts.forEach((p,i)=>{ ctx.fillStyle=TC.cyan; ctx.beginPath(); ctx.arc(x(i),y(p.v),3.5,0,7); ctx.fill();
    ctx.fillStyle=TC.ink; ctx.font='700 9px monospace'; ctx.textAlign='center'; ctx.fillText(Math.round(p.v),x(i),y(p.v)-8); });
  // month labels (first & last)
  ctx.fillStyle=TC.faint; ctx.font='8px monospace';
  ctx.textAlign='left'; ctx.fillText(monthLabel(pts[0].k).split(' ')[0], pad, H-8);
  ctx.textAlign='right'; ctx.fillText(monthLabel(pts[pts.length-1].k).split(' ')[0], W-10, H-8);
  if(note){ const delta=Math.round(pts[pts.length-1].v-pts[0].v);
    note.textContent=(delta>=0?'▲ Up ':'▼ Down ')+Math.abs(delta)+' points across '+pts.length+' months of tracking.'; note.style.color=delta>=0?'var(--climb)':'var(--descent)'; }
}
function paintPoaStats(){
  const el=$('#poaStats'); if(!el) return;
  let done=0,total=0,withPlan=0;
  DB.students.forEach(s=>{ if(s.poa.length){ withPlan++; total+=s.poa.length; done+=s.poa.filter(p=>p.done).length; } });
  const rate=total?Math.round(done/total*100):0;
  const overdue=DB.students.reduce((a,s)=>a+s.poa.filter(p=>!p.done&&p.due&&new Date(p.due)<new Date()).length,0);
  el.innerHTML=`
    <div style="display:flex;gap:18px;align-items:center;margin-bottom:16px">
      <div style="flex:none">${donutRing(rate, done+'/'+total)}</div>
      <div style="flex:1"><div class="gNum" style="font-size:26px">${rate}<span style="font-size:14px;color:var(--faint)">%</span></div>
        <div class="gLab">of all action items completed</div></div>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--horizon)">

      <div><div class="mono" style="font-size:18px;font-weight:700">${total-done}</div><div class="gLab">still open</div></div>
      <div><div class="mono" style="font-size:18px;font-weight:700;color:${overdue?'var(--descent)':'var(--ink)'}">${overdue}</div><div class="gLab">overdue</div></div>
    </div>
    ${total?'':'<div style="font-size:11.5px;color:var(--faint);margin-top:12px">No action items yet — add plans on cadet profiles to track follow-through.</div>'}`;

function paintGapMatrix(){
  const el=$('#gapMatrix'); if(!el) return;
  const byGoal={};
  DB.students.forEach(s=>{ if(s.goal && ROLE_NEEDS[s.goal]){ byGoal[s.goal]=byGoal[s.goal]||[]; byGoal[s.goal].push(s); } });
  const goals=Object.keys(byGoal);
  if(!goals.length){ el.innerHTML='<div class="empty" style="padding:20px"><div class="e1">No goals set yet</div>Once cadets have goals, this shows which required skills are most commonly missing per track.</div>'; return; }
  el.innerHTML=goals.map(g=>{
    const cadets=byGoal[g], needs=ROLE_NEEDS[g]||[];
    // for each need, count cadets who DON'T show it
    const gaps=needs.map(n=>{ const missing=cadets.filter(s=>{ const have=[...(s.strengths||[]),...((s.ratedSkills||[]).map(r=>r.skill))]; return !have.some(x=>x.toLowerCase().includes(n.toLowerCase().split(' ')[0])); }).length;
      return {n,missing,pct:Math.round(missing/cadets.length*100)}; }).sort((a,b)=>b.missing-a.missing);
    return `<div style="margin-bottom:18px"><div style="font-size:13px;font-weight:640;margin-bottom:4px">${esc(shortGoal(g))} <span class="mono" style="color:var(--faint);font-size:10px">· ${cadets.length} cadet${cadets.length!==1?'s':''}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${gaps.map(x=>`<span class="chip" style="border-color:${x.pct>=60?'rgba(255,107,122,.4)':'var(--horizon)'};color:${x.pct>=60?'var(--descent)':x.pct>=30?'var(--amber)':'var(--dim)'}">${esc(x.n)} · ${x.missing}/${cadets.length} missing</span>`).join('')}</div></div>`;
  }).join('');
}

/* donut chart — goal distribution, interactive */
const CHART_COLORS=['#38e8d0','#ffb84d','#a78bfa','#4ade80','#ff6b7a','#5eb3ff','#f77fbe','#9de24d','#ff9d5c','#5ce0c8','#c792ea','#ffd166','#06d6a0','#ef476f','#7aa5ff','#b8b8ff'];
function drawDonut(){
  const cv=$('#donut'); if(!cv) return;
  const {ctx}=setupCanvas(cv,200,200);
  const dist=goalDistribution(); const total=dist.reduce((a,[,n])=>a+n,0);
  const cx=100,cy=100,rO=88,rI=54;
  if(!total){ ctx.fillStyle=cssVar('--faint'); ctx.font='11px monospace'; ctx.textAlign='center'; ctx.fillText('no goals set',100,104); return; }
  let a0=-Math.PI/2;
  const segs=[];
  dist.forEach(([g,n],i)=>{ const frac=n/total; const a1=a0+frac*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rO,a0,a1); ctx.closePath();
    ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length]; ctx.fill();
    segs.push({g,n,a0,a1,color:CHART_COLORS[i%CHART_COLORS.length]}); a0=a1; });
  // punch hole
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(cx,cy,rI,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  // center label
  ctx.fillStyle=cssVar('--ink'); ctx.font='700 26px monospace'; ctx.textAlign='center'; ctx.fillText(total,cx,cy-2);
  ctx.fillStyle=cssVar('--dim'); ctx.font='9px monospace'; ctx.fillText('WITH GOAL',cx,cy+14);
  // legend
  const leg=$('#donutLegend');
  leg.innerHTML=dist.map(([g,n],i)=>`<div class="legRow" data-goal="${esc(g)}" style="display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px">
    <span style="width:10px;height:10px;border-radius:3px;flex:none;background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>
    <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(shortGoal(g))}</span>
    <span class="mono" style="color:var(--dim)">${n}</span></div>`).join('');
  $$('#donutLegend .legRow').forEach(el=>{
    el.onmouseenter=()=>el.style.background='var(--surface2)'; el.onmouseleave=()=>el.style.background='';
    el.onclick=()=>{ VIEW='roster'; CURRENT=null; render(); setTimeout(()=>{ const f=$('#rSearch'); if(f){ f.value=shortGoal(el.dataset.goal); paintFleet(); } },50); };
  });
  // hover on donut
  cv.onmousemove=(e)=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left-cx, y=e.clientY-r.top-cy;
    const dist2=Math.sqrt(x*x+y*y); if(dist2<rI||dist2>rO){ cv.title=''; return; }
    let ang=Math.atan2(y,x); if(ang<-Math.PI/2) ang+=Math.PI*2;
    const seg=segs.find(sg=>ang>=sg.a0&&ang<sg.a1); cv.title=seg?`${shortGoal(seg.g)}: ${seg.n}`:''; };
}

/* histogram — readiness bands */
function drawHisto(){
  const cv=$('#histo'); if(!cv) return;
  const {ctx,W,H}=setupCanvas(cv,440,210);
  const TC=themeColors();
  const buckets=readinessBuckets(); const max=Math.max(1,...buckets);
  const labels=['0–20','20–40','40–60','60–80','80–100'];
  const colors=['#ff6b7a','#ff9d5c','#ffb84d','#9de24d','#4ade80'];
  const pad=30, bw=(W-pad*2)/5, gap=14;
  buckets.forEach((n,i)=>{
    const h=(n/max)*(H-50); const x=pad+i*bw, y=H-30-h;
    ctx.fillStyle=colors[i]; ctx.globalAlpha=.85;
    roundRect(ctx,x+gap/2,y,bw-gap,h,6); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=TC.ink; ctx.font='700 13px monospace'; ctx.textAlign='center'; if(n) ctx.fillText(n,x+bw/2,y-8);
    ctx.fillStyle=TC.dim; ctx.font='9px monospace'; ctx.fillText(labels[i],x+bw/2,H-12);
  });
}
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); if(h<=0){return;} ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* tiny sparkline of readiness history */
function sparkline(s){
  const h=(s.history||[]).map(x=>x.readiness); if(h.length<2) return '<div style="width:70px"></div>';
  const max=Math.max(...h,1), min=Math.min(...h,0), rng=Math.max(1,max-min);
  const pts=h.map((v,i)=>`${(i/(h.length-1))*66+2},${22-((v-min)/rng)*18-2}`).join(' ');
  const up=h[h.length-1]>=h[0];
  return `<svg width="70" height="24" style="flex:none"><polyline points="${pts}" fill="none" stroke="${up?'var(--climb)':'var(--descent)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

  const goalOpts=(cur)=>['<option value="">— goal —</option>'].concat(ROLES.map(r=>`<option value="${esc(r)}"${cur===r?' selected':''}>${esc(shortGoal(r))}</option>`)).join('');
  el.innerHTML=`
    <div class="panel" style="padding:0;overflow:hidden">
      <div class="bulkHead">
        <div style="flex:0 0 30px">#</div>
        <div style="flex:2;min-width:130px">Cadet</div>
        <div style="flex:2;min-width:150px">Career goal</div>
        <div style="flex:0 0 70px;text-align:center">Ready</div>
        <div style="flex:3;min-width:160px">Quick add strength</div>
      </div>
      <div id="bulkRows">
        ${DB.students.slice().sort((a,b)=>a.sno-b.sno).map(s=>`
          <div class="bulkRow" data-id="${esc(s.id)}">
            <div style="flex:0 0 30px" class="mono" >${s.sno}</div>
            <div style="flex:2;min-width:130px;display:flex;align-items:center;gap:9px">
              <div class="badge ${statusOf(s)}" style="width:28px;height:28px;font-size:10px">${esc(initials(s.name))}</div>
              <span style="font-size:12.5px;font-weight:560;cursor:pointer" data-open5="${esc(s.id)}">${esc(tc(s.name))}</span>
            </div>
            <div style="flex:2;min-width:150px"><select class="field bulkGoal" data-bid="${esc(s.id)}" style="width:100%;padding:7px 26px 7px 10px;font-size:12px">${goalOpts(s.goal)}</select></div>
            <div style="flex:0 0 70px;text-align:center" class="mono" style="font-size:12px;color:var(--dim)">${progress(s)}%</div>
            <div style="flex:3;min-width:160px;display:flex;gap:6px">
              <select class="field bulkStr" data-bid="${esc(s.id)}" style="flex:1;padding:7px 24px 7px 9px;font-size:11.5px"><option value="">＋ strength…</option>${libOptions(STRENGTH_LIBRARY,s.strengths)}</select>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Changes save instantly. Set a goal from the dropdown, or pick a strength to add it. Click a name to open the full profile.</div>`;
  // wire goal change
  $$('.bulkGoal').forEach(sel=>sel.onchange=()=>{ const s=DB.students.find(x=>x.id===sel.dataset.bid); s.goal=sel.value; s.updated=new Date().toISOString(); store.save(); toast('Goal set for '+tc(s.name)); const row=sel.closest('.bulkRow'); /* update readiness cell */ paintBulkTable(); });
  $$('.bulkStr').forEach(sel=>sel.onchange=()=>{ if(!sel.value) return; const s=DB.students.find(x=>x.id===sel.dataset.bid); s.strengths=s.strengths||[]; if(!s.strengths.some(x=>x.toLowerCase()===sel.value.toLowerCase())){ s.strengths.push(sel.value); store.save(); toast('Added “'+sel.value+'” to '+tc(s.name)); } paintBulkTable(); });
  $$('[data-open5]').forEach(el=>el.onclick=()=>openStudent(el.dataset.open5));
}

/* ---- cohort groups: grouped by goal, with batch actions ---- */
function paintGroups(){
  const el=$('#bulkBody'); if(!el) return;
  const groups={}; DB.students.forEach(s=>{ const g=s.goal||'__nogoal'; (groups[g]=groups[g]||[]).push(s); });
  const order=Object.keys(groups).sort((a,b)=>{ if(a==='__nogoal') return 1; if(b==='__nogoal') return -1; return groups[b].length-groups[a].length; });
  el.innerHTML=order.map(g=>{
    const list=groups[g], isNo=g==='__nogoal';
    const avg=Math.round(list.reduce((a,s)=>a+progress(s),0)/list.length);
    return `<div class="panel">
      <div class="panelHead">
        <div class="panelTitle"><span class="dotc" style="background:${isNo?'var(--faint)':'var(--cyan)'}"></span>${isNo?'No goal set':esc(shortGoal(g))} <span class="mono" style="color:var(--faint);font-size:11px;font-weight:400">· ${list.length} cadet${list.length!==1?'s':''} · ${avg}% avg</span></div>
        ${isNo?'':`<div style="display:flex;gap:8px"><button class="btn sm" data-grouppoa="${esc(g)}">＋ Action to group</button><button class="btn sm" data-groupstr="${esc(g)}">＋ Strength to group</button></div>`}
      </div>
      <div class="groupGrid">
        ${list.sort((a,b)=>a.sno-b.sno).map(s=>`<div class="groupChip" data-open6="${esc(s.id)}">
          <div class="badge ${statusOf(s)}" style="width:26px;height:26px;font-size:9px">${esc(initials(s.name))}</div>
          <span style="font-size:12px">${esc(tc(s.name))}</span>
          <span class="mono" style="font-size:9px;color:var(--faint);margin-left:auto">${progress(s)}%</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  $$('[data-open6]').forEach(el=>el.onclick=()=>openStudent(el.dataset.open6));
  $$('[data-grouppoa]').forEach(b=>b.onclick=()=>groupAction(b.dataset.grouppoa,'poa'));
  $$('[data-groupstr]').forEach(b=>b.onclick=()=>groupAction(b.dataset.groupstr,'strength'));
}

function groupAction(goal,type){
  const list=DB.students.filter(s=>(s.goal||'')===goal);
  if(type==='poa'){
    modal(`<button class="mClose" data-close>✕</button>
      <div class="kicker">Batch action · ${esc(shortGoal(goal))}</div>
      <h2 style="font-size:19px;margin-bottom:6px">Add an action to all ${list.length} cadets</h2>
      <p style="color:var(--dim);font-size:12.5px;margin-bottom:14px">This adds the same plan-of-action step to every cadet aiming for ${esc(shortGoal(goal))}.</p>
      <label class="fl">Action step</label>
      <input class="field full" id="gaText" placeholder="e.g. Attend the DGCA orientation workshop">
      <label class="fl">Due date (optional)</label>
      <input class="field full" id="gaDue" type="date">
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn go" id="gaSave">Add to all ${list.length}</button><button class="btn" data-close>Cancel</button></div>`);
    $('#gaSave').onclick=()=>{ const t=$('#gaText').value.trim(); if(!t){ toast('Type the action first'); return; }
      list.forEach(s=>{ s.poa=s.poa||[]; s.poa.push({text:t,due:$('#gaDue').value||'',done:false,added:new Date().toISOString(),batch:true}); });
      store.save(); closeModal(); render(); toast('Added to '+list.length+' cadets'); };
  } else {
    modal(`<button class="mClose" data-close>✕</button>
      <div class="kicker">Batch action · ${esc(shortGoal(goal))}</div>
      <h2 style="font-size:19px;margin-bottom:6px">Add a strength to all ${list.length} cadets</h2>
      <label class="fl">Strength</label>
      <select class="field full" id="gaStr"><option value="">— pick —</option>${STRENGTH_LIBRARY.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn go" id="gaSave2">Add to all ${list.length}</button><button class="btn" data-close>Cancel</button></div>`);
    $('#gaSave2').onclick=()=>{ const v=$('#gaStr').value; if(!v){ toast('Pick a strength'); return; }
      list.forEach(s=>{ s.strengths=s.strengths||[]; if(!s.strengths.some(x=>x.toLowerCase()===v.toLowerCase())) s.strengths.push(v); });
      store.save(); closeModal(); render(); toast('Added to '+list.length+' cadets'); };
  }
}


/* ═══════════════════════ STAGE 6 · semester roadmap ═══════════════════════ */
/* default milestones a mentor might track; stored in DB.roadmap and editable */
const DEFAULT_MILESTONES=[
  {id:'m1',title:'Meet every cadet at least once',by:'Month 1',done:false,auto:'metAll'},
  {id:'m2',title:'Career goal set for every cadet',by:'Month 1',done:false,auto:'goalAll'},
  {id:'m3',title:'Strengths & gaps noted for every cadet',by:'Month 2',done:false,auto:'sgAll'},
  {id:'m4',title:'A plan of action for every cadet',by:'Month 2',done:false,auto:'poaAll'},
  {id:'m5',title:'Skills assessed for goal-track cadets',by:'Month 3',done:false,auto:'skillAll'},
  {id:'m6',title:'Mid-semester progress review',by:'Month 3',done:false},
  {id:'m7',title:'Second session logged for every cadet',by:'Month 4',done:false,auto:'met2'},
  {id:'m8',title:'End-of-semester readiness report',by:'Month 5',done:false}
];
function roadmapData(){ if(!DB.roadmap){ DB.roadmap=JSON.parse(JSON.stringify(DEFAULT_MILESTONES)); store.save(); } return DB.roadmap; }

/* auto-progress: compute how far along each auto milestone is */
function milestoneProgress(m){
  const S=DB.students, n=S.length;
  const done=(f)=>S.filter(f).length;
  switch(m.auto){
    case 'metAll': return {have:done(s=>s.sessions.length),need:n};
    case 'goalAll': return {have:done(s=>s.goal),need:n};
    case 'sgAll': return {have:done(s=>s.strengths.length&&s.weaknesses.length),need:n};
    case 'poaAll': return {have:done(s=>s.poa.length),need:n};
    case 'skillAll': { const tgt=S.filter(s=>s.goal); return {have:tgt.filter(s=>(s.ratedSkills||[]).length).length,need:tgt.length||n}; }
    case 'met2': return {have:done(s=>s.sessions.length>=2),need:n};
    default: return null;
  }
}
function roadmapView(){
  const M=roadmapData();
  const S=DB.students;
  const autoDone=M.filter(m=>{ const p=milestoneProgress(m); return p&&p.have>=p.need&&p.need>0; }).length;
  const manualDone=M.filter(m=>!m.auto&&m.done).length;
  const total=M.length, complete=autoDone+manualDone;
  return `
    <div class="head"><div>
      <div class="kicker">Semester plan · AY 2026-27</div>
      <h1 class="title">Roadmap</h1>
      <div class="lede">What should happen by when. Milestones tied to your data tick themselves off as you work through the batch; the rest you mark manually. A clear path from day one to the end-of-semester report.</div>
    </div>
    <div style="text-align:right"><div class="gNum" style="font-size:30px">${complete}<span style="font-size:16px;color:var(--faint)">/${total}</span></div><div class="gLab">milestones met</div></div></div>

    <div class="panel">
      <div class="roadTrack"><div class="roadFill" style="width:${Math.round(complete/total*100)}%"></div></div>
      <div class="timeline" style="margin-top:22px">
        ${M.map(m=>{
          const p=m.auto?milestoneProgress(m):null;
          const isDone=p? (p.have>=p.need&&p.need>0) : m.done;
          const pct=p&&p.need? Math.round(p.have/p.need*100):0;
          return `<div class="tlItem roadItem">
            <div class="roadDot ${isDone?'done':''}" ${m.auto?'':`data-mtoggle="${m.id}"`} style="${m.auto?'':'cursor:pointer'}">${isDone?'✓':''}</div>
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
                <div class="tlNotes" style="font-weight:600${isDone?';color:var(--dim);text-decoration:line-through':''}">${esc(m.title)}</div>
                <div class="mono" style="font-size:9px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase;white-space:nowrap">${esc(m.by)}</div>
              </div>
              ${m.auto? `<div style="margin-top:7px"><div class="traj" style="margin:0;height:6px"><div class="trajFill${isDone?'':' new'}" style="width:${pct}%"></div></div>
                <div class="mono" style="font-size:9px;color:var(--faint);margin-top:4px">${p.have}/${p.need} cadets · auto-tracked</div></div>`
                : `<div class="mono" style="font-size:9px;color:var(--faint);margin-top:5px">${isDone?'marked complete':'tap the circle when done'}</div>`}
            </div></div>`;
        }).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn sm" id="addMilestone">＋ Add milestone</button>
      <button class="btn sm" id="resetRoadmap">↺ Reset to defaults</button>
    </div>`;
}
function wireRoadmap(){
  $$('[data-mtoggle]').forEach(d=>d.onclick=()=>{ const m=DB.roadmap.find(x=>x.id===d.dataset.mtoggle); m.done=!m.done; store.save(); render(); });
  $('#addMilestone').onclick=()=>{
    modal(`<button class="mClose" data-close>✕</button><div class="kicker">New milestone</div>
      <h2 style="font-size:19px;margin-bottom:14px">Add a milestone</h2>
      <label class="fl">Milestone</label><input class="field full" id="mTitle" placeholder="e.g. Arrange industry visit">
      <label class="fl">Target (when)</label><input class="field full" id="mBy" placeholder="e.g. Month 4">
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn go" id="mSave">Add</button><button class="btn" data-close>Cancel</button></div>`);
    $('#mSave').onclick=()=>{ const t=$('#mTitle').value.trim(); if(!t){ toast('Type the milestone'); return; }
      DB.roadmap.push({id:'m'+Date.now(),title:t,by:$('#mBy').value.trim()||'This semester',done:false}); store.save(); closeModal(); render(); toast('Milestone added'); };
  };
  $('#resetRoadmap').onclick=()=>{ DB.roadmap=JSON.parse(JSON.stringify(DEFAULT_MILESTONES)); store.save(); render(); toast('Roadmap reset'); };
}


/* ─────────── modal + nav + backup ─────────── */
function modal(html){ $('#modalBody').innerHTML=html; $('#scrim').hidden=false; $$('[data-close]').forEach(b=>b.onclick=closeModal); }
function closeModal(){ $('#scrim').hidden=true; }
$('#scrim').addEventListener('click',e=>{ if(e.target===$('#scrim')) closeModal(); });

$$('.navItem').forEach(n=>n.onclick=()=>{ VIEW=n.dataset.view; CURRENT=null; render(); });

$('#exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mentor-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('Backup downloaded'); };
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.students||!Array.isArray(d.students)) throw 0; DB=d;
    DB.students.forEach(s=>{ s.strengths=s.strengths||[]; s.weaknesses=s.weaknesses||[]; s.skills=s.skills||[]; s.sessions=s.sessions||[]; s.poa=s.poa||[]; });
    store.save(); CURRENT=null; render(); toast('Restored · '+d.students.length+' cadets'); }catch(_){ toast('That file could not be read'); } };
  r.readAsText(f); };


/* ── theme (day / night) ── */
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('mentor.theme',t); }catch(e){}
  const btn=document.getElementById('themeBtn'); if(btn) btn.textContent = t==='light' ? '☾ Night mode' : '☀ Day mode';
  /* redraw canvases with theme colors */
  if(VIEW==='analytics' && !CURRENT){ try{ wireAnalytics(); }catch(e){} }
}
(function(){ let t='dark'; try{ t=localStorage.getItem('mentor.theme')||'dark'; }catch(e){} document.documentElement.setAttribute('data-theme',t); })();
document.getElementById('themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme')||'dark'; applyTheme(cur==='light'?'dark':'light'); };
/* manual lock */
(function(){ const lb=document.getElementById('lockNowBtn'); if(lb) lb.onclick=()=>{
  try{ sessionStorage.removeItem('mentor.unlocked'); }catch(e){}
  const scr=document.getElementById('lockScreen'), inp=document.getElementById('lockInput'), msg=document.getElementById('lockMsg');
  if(msg) msg.textContent=''; if(inp) inp.value='';
  if(scr){ scr.classList.remove('unlocked'); setTimeout(()=>inp&&inp.focus(),300); }
}; })();
/* redraw charts crisply on resize */
let RESZ; window.addEventListener('resize',()=>{ clearTimeout(RESZ); RESZ=setTimeout(()=>{ if(VIEW==='analytics'&&!CURRENT){ try{ wireAnalytics(); }catch(e){} } },200); });
applyTheme(document.documentElement.getAttribute('data-theme')||'dark');

/* ═══ password lock ═══ */
(function(){
  const PASS='2000';
  const scr=document.getElementById('lockScreen'), inp=document.getElementById('lockInput'),
        btn=document.getElementById('lockBtn'), msg=document.getElementById('lockMsg'), ico=document.getElementById('lockIcon');
  let ok=false; try{ ok=sessionStorage.getItem('mentor.unlocked')==='1'; }catch(e){}
  if(ok){ scr.classList.add('unlocked'); }
  else { setTimeout(()=>inp&&inp.focus(),300); }
  function tryUnlock(){
    if(inp.value===PASS){ try{ sessionStorage.setItem('mentor.unlocked','1'); }catch(e){} scr.classList.add('unlocked'); }
    else { msg.textContent='Incorrect passcode'; ico.classList.add('shake'); inp.value=''; setTimeout(()=>ico.classList.remove('shake'),400); setTimeout(()=>inp.focus(),50); }
  }
  btn&&(btn.onclick=tryUnlock);
  inp&&inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); tryUnlock(); } });
})();

render();
</script>
</body>
</html>
